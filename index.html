        <div class="right"><button class="btn ghost" type="button" id="p-cancel">Cancel</button><button class="btn" type="submit" form="pform" id="p-save">${isNew ? "Add plushie" : "Save"}</button></div>
      </div>`, (el) => {
      const showPhoto = () => {
        el.querySelector("#p-photo-box").innerHTML = photo ? `<img src="${esc(photo)}" alt="Photo of this plushie">` : `<div class="photo-empty">No photo yet</div>`;
        el.querySelector("#p-photo-btn").textContent = photo ? "Change photo" : "Add photo";
        el.querySelector("#p-photo-rm").hidden = !photo;
      };
      showPhoto();
      const bcIn = el.querySelector("#p-barcode");
      let bcTimer;
      const showBarcode = () => {
        const v = bcIn.value.trim();
        el.querySelector("#p-bc-rm").hidden = !v;
        drawBarcode(el.querySelector("#p-bc-img"), v);
      };
      showBarcode();
      bcIn.addEventListener("input", () => { clearTimeout(bcTimer); bcTimer = setTimeout(showBarcode, 300); });
      el.querySelector("#p-bc-gen").addEventListener("click", () => { bcIn.value = nextBarcode(); showBarcode(); });
      el.querySelector("#p-bc-rm").addEventListener("click", () => { bcIn.value = ""; showBarcode(); });
      el.querySelector("#p-bc-scan").addEventListener("click", () => openScanner("Scan this plushie's tag", (code) => {
        const other = productByBarcode(code);
        if (other && other.id !== p.id) { toast(`That barcode is already on ${other.name}.`); return; }
        bcIn.value = code; showBarcode(); toast(`Barcode ${code} added`);
      }, { once: true }));
      el.querySelector("#p-photo-btn").addEventListener("click", () => el.querySelector("#p-file").click());
      el.querySelector("#p-photo-rm").addEventListener("click", () => { photo = ""; showPhoto(); });
      el.querySelector("#p-file").addEventListener("change", async (e) => {
        const f = e.target.files && e.target.files[0]; e.target.value = "";
        if (!f) return;
        const btn = el.querySelector("#p-photo-btn"); btn.disabled = true; btn.textContent = "Loading…";
        try { photo = await shrinkPhoto(f); } catch (ex) { console.error(ex); toast("Couldn't open that photo. Try a JPG or PNG."); }
        btn.disabled = false; showPhoto();
      });
      el.querySelector("#p-colors").addEventListener("click", (e) => {
        const b = e.target.closest("button[data-c]"); if (!b) return;
        color = b.dataset.c;
        el.querySelectorAll("#p-colors button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      });
      el.querySelector("#p-cancel").addEventListener("click", closeSheet);
      el.querySelector("#pform").addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = el.querySelector("#p-name").value.trim();
        if (!name) { el.querySelector("#p-name").focus(); toast("Give the plushie a name."); return; }
        const barcode = bcIn.value.trim();
        const clash = barcode && productByBarcode(barcode);
        if (clash && clash.id !== p.id) { bcIn.focus(); toast(`That barcode is already on ${clash.name}.`); return; }
        const pattern = cleanUrl(el.querySelector("#p-pattern").value);
        if (pattern === null) { el.querySelector("#p-pattern").focus(); toast("That pattern link doesn't look like a web address."); return; }
        const data = {
          name,
          price: round2(el.querySelector("#p-price").value),
          cost: round2(el.querySelector("#p-cost").value),
          stock: Math.max(0, parseInt(el.querySelector("#p-stock").value, 10) || 0),
          hours: Number(el.querySelector("#p-hours").value) || 0,
          notes: el.querySelector("#p-notes").value.trim(),
          color,
          createdAt: p.createdAt || Date.now(),
        };
        if (photo) data.photo = photo;
        if (pattern) data.pattern = pattern;
        if (barcode) data.barcode = barcode;
        if (p.example) data.example = true;
        const ok = await api.saveProduct(p.id || uid(), data);
        if (ok) { closeSheet(); toast(isNew ? "Plushie added" : "Saved"); }
      });
      if (!isNew) armDelete(el.querySelector("#p-del"), "Delete", async () => {
        if (await api.deleteProduct(p.id)) { closeSheet(); toast("Plushie deleted. Its past sales stay in your history."); }
      });
    });
  }

  function eventSheet(ev) {
    const isNew = !ev;
    ev = ev || { name: "", start: todayStr(), end: "", location: "", fee: "", notes: "" };
    openSheet(`
      <h3>${isNew ? "Add an event" : "Edit event"}</h3>
      <form id="eform" class="fgrid" novalidate>
        <label class="f full">Name<input id="e-name" required value="${esc(ev.name)}" placeholder="e.g. Holiday Craft Fair"></label>
        <label class="f">First day<input id="e-start" type="date" value="${esc(ev.start)}"></label>
        <label class="f">Last day<input id="e-end" type="date" value="${esc(ev.end && ev.end !== ev.start ? ev.end : "")}" aria-describedby="e-end-hint"></label>
        <div class="full sub" id="e-end-hint" style="color:var(--muted);font-size:.8rem;margin-top:-6px">Leave “Last day” empty for a one-day event.</div>
        <label class="f full">Location<input id="e-loc" value="${esc(ev.location)}" placeholder="Venue or address"></label>
        <label class="f">Booth fee<input id="e-fee" type="number" inputmode="decimal" min="0" step="0.01" value="${esc(ev.fee)}" placeholder="0.00"></label>
        <label class="f full">Notes<textarea id="e-notes" placeholder="Booth number, setup time, contact">${esc(ev.notes)}</textarea></label>
      </form>
      <div class="actions">
        ${isNew ? "" : `<button class="btn danger" id="e-del" type="button">Delete</button>`}
        <div class="right"><button class="btn ghost" type="button" id="e-cancel">Cancel</button><button class="btn" type="submit" form="eform">${isNew ? "Add event" : "Save"}</button></div>
      </div>`, (el) => {
      const $ = (id) => el.querySelector(id);
      $("#e-cancel").addEventListener("click", closeSheet);
      $("#eform").addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = $("#e-name").value.trim();
        if (!name) { $("#e-name").focus(); toast("Give the event a name."); return; }
        let start = $("#e-start").value || todayStr(), end = $("#e-end").value || start;
        if (end < start) [start, end] = [end, start];
        const data = { name, start, end, location: $("#e-loc").value.trim(), fee: round2($("#e-fee").value), notes: $("#e-notes").value.trim(), createdAt: ev.createdAt || Date.now() };
        if (ev.example) data.example = true;
        if (await api.saveEvent(ev.id || uid(), data)) { closeSheet(); toast(isNew ? "Event added" : "Saved"); }
      });
      if (!isNew) armDelete($("#e-del"), "Delete", async () => {
        if (await api.deleteEvent(ev.id)) { closeSheet(); toast("Event deleted. Its sales stay in your history."); }
      });
    });
  }

  // A sale can hold several plushies. Each plushie is stored as its own sales line (so stock, best sellers
  // and per-show totals work per plushie); lines bought together share an orderId.
  function saleSheet(orig) {
    const isNew = !orig || !orig.length;
    const first = isNew ? null : orig[0];
    const imported = !isNew && orig.some((x) => x.imported);
    const products = state.products.slice().sort((a, b) => (a.name || "").localeCompare(b.name || ""));
    // She sells only at shows: a new sale starts at today's event, otherwise the event of the last sale she recorded
    const by = eventsInPickOrder();
    const last = state.sales.filter((x) => !x.imported).reduce((a, b) => ((b.createdAt || 0) > ((a && a.createdAt) || 0) ? b : a), null);
    let head;
    if (isNew) {
      const evId = by.now.length ? by.now[0].id : last && eventById(last.eventId) ? last.eventId : "";
      head = { date: todayStr(), eventId: evId, eventName: "", channel: evId ? "Craft fair" : lastOffShowChannel(), note: "", payment: payMethods()[0] };
    } else {
      head = { date: first.date, eventId: first.eventId || "", eventName: first.eventName || "", channel: first.channel || "", note: first.note || "", payment: first.payment || "" };
    }
    // With no plushies set up yet, a line opens ready to type a new one
    const blankLine = () => ({ productId: products.length ? "" : "__new", qty: 1, price: "", newName: "" });
    const lines = isNew ? [blankLine()]
      : orig.map((x) => ({ docId: x.id, productId: x.productId, productName: x.productName, color: x.color, unitCost: x.unitCost, qty: x.qty || 1, price: x.unitPrice ?? "", newName: "" }));

    const evOpt = (ev) => `<option value="${esc(ev.id)}" ${ev.id === head.eventId ? "selected" : ""}>${esc(ev.name)} · ${esc(evDates(ev))}</option>`;
    const evGroup = (label, list) => (list.length ? `<optgroup label="${label}">${list.map(evOpt).join("")}</optgroup>` : "");
    const evMissing = head.eventId && !eventById(head.eventId) ? `<option value="${esc(head.eventId)}" selected>${esc(head.eventName || "Deleted event")} (deleted)</option>` : "";
    const evSelect = `<option value="">No event</option>${evMissing}${evGroup("Today", by.now)}${evGroup("Coming up", by.upcoming)}${evGroup("Past", by.past.slice(0, 25))}<option value="__new">+ New event…</option>`;
    const channels = head.channel && !CHANNELS.includes(head.channel) ? [...CHANNELS, head.channel] : CHANNELS;

    const lineTotal = (ln) => round2(ln.qty * (Number(ln.price) || 0));
    const lineHTML = (ln, i) => {
      const missing = ln.productId && ln.productId !== "__new" && !productById(ln.productId)
        ? `<option value="${esc(ln.productId)}" selected>${esc(ln.productName || "Plushie")} (not in Products)</option>` : "";
      const opts = products.map((p) => `<option value="${esc(p.id)}" ${p.id === ln.productId ? "selected" : ""}>${esc(p.name)} (${p.stock || 0} left)</option>`).join("");
      return `<div class="line" data-i="${i}">
        <div class="line-top">
          <select class="l-product" aria-label="Plushie">${products.length ? `<option value="" ${ln.productId ? "" : "selected"}>Choose a plushie…</option>` : ""}${missing}${opts}<option value="__new" ${ln.productId === "__new" ? "selected" : ""}>+ New plushie…</option></select>
          ${lines.length > 1 ? `<button type="button" class="l-remove" aria-label="Remove this plushie">×</button>` : ""}
        </div>
        ${ln.productId === "__new" ? `<input class="l-newname" autocomplete="off" placeholder="New plushie's name" value="${esc(ln.newName)}" aria-label="New plushie name">` : ""}
        <div class="line-bottom">
          <div class="stepper"><button type="button" class="l-minus" aria-label="One fewer">−</button><span class="n num">${ln.qty}</span><button type="button" class="l-plus" aria-label="One more">+</button></div>
          <label class="l-price"><span aria-hidden="true">× $</span><input class="l-pricein" type="number" inputmode="decimal" min="0" step="0.01" value="${esc(ln.price)}" placeholder="Price" aria-label="Price each"></label>
          <span class="l-sub num">${fmt(lineTotal(ln))}</span>
        </div>
      </div>`;
    };

    openSheet(`
      <h3>${isNew ? "Record a sale" : "Edit sale"}</h3>
      ${imported ? `<p class="hint">Imported past sale. Changing or deleting it won't affect current stock.</p>` : ""}
      <div id="s-lines"></div>
      <div class="line-actions">
        <button type="button" class="btn ghost small" id="s-addline">+ Add another plushie</button>
        <button type="button" class="btn ghost small" id="s-scan"><svg width="16" height="14" viewBox="0 0 16 14" aria-hidden="true"><path d="M1 1v12M4 1v12M6 1v12M9 1v12M12 1v12M15 1v12" stroke="currentColor" stroke-width="1.6" fill="none"/></svg> Scan barcode</button>
      </div>
      <div class="f" style="margin-bottom:14px"><span>Paid with</span>
        <div class="pay-pills" id="s-pay" role="radiogroup" aria-label="Paid with">
          ${[...payMethods(), ...(head.payment && !payMethods().includes(head.payment) ? [head.payment] : [])]
            .map((m) => `<button type="button" role="radio" data-pay="${esc(m)}" aria-checked="${m === head.payment}">${esc(m)}</button>`).join("")}
        </div>
      </div>
      <form id="sform" class="fgrid" novalidate>
        <label class="f full">Event<select id="s-event">${evSelect}</select></label>
        <label class="f full" id="s-newev-wrap" hidden>New event name<input id="s-newev" placeholder="e.g. Holiday Craft Fair"></label>
        <label class="f">Date<input id="s-date" type="date" value="${esc(head.date)}"></label>
        <label class="f">Sold through<select id="s-channel">${channels.map((c) => `<option ${c === head.channel ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></label>
        <label class="f full">Note<input id="s-note" value="${esc(head.note)}" placeholder="Buyer, discount…"></label>
      </form>
      <div class="total-line"><span class="label" id="s-count">Total</span><span class="v num" id="s-total"></span></div>
      <div class="actions">
        ${isNew ? "" : `<button class="btn danger" id="s-del" type="button">Delete sale</button>`}
        <div class="right"><button class="btn ghost" type="button" id="s-cancel">Cancel</button><button class="btn" type="submit" form="sform" id="s-save">${isNew ? "Save sale" : "Save"}</button></div>
      </div>`, (el) => {
      const $ = (id) => el.querySelector(id);
      const box = $("#s-lines");
      const updTotal = () => {
        const units = lines.reduce((n, ln) => n + ln.qty, 0);
        $("#s-total").textContent = fmt(lines.reduce((n, ln) => n + lineTotal(ln), 0));
        $("#s-count").textContent = units > 1 ? `Total · ${units} plushies` : "Total";
      };
      const renderLines = () => { box.innerHTML = lines.map(lineHTML).join(""); updTotal(); };
      renderLines();
      const lineOf = (t) => { const d = t.closest(".line"); return d ? [lines[+d.dataset.i], d] : [null, null]; };

      box.addEventListener("change", (e) => {
        if (!e.target.matches(".l-product")) return;
        const [ln, d] = lineOf(e.target), i = +d.dataset.i;
        ln.productId = e.target.value;
        const p = productById(ln.productId);
        if (p) ln.price = p.price || p.price === 0 ? p.price : ""; // default price, which she can type over
        renderLines();
        const row = box.querySelectorAll(".line")[i];
        if (ln.productId === "__new") row.querySelector(".l-newname").focus();
      });
      box.addEventListener("input", (e) => {
        const [ln, d] = lineOf(e.target); if (!ln) return;
        if (e.target.matches(".l-newname")) ln.newName = e.target.value;
        if (e.target.matches(".l-pricein")) { ln.price = e.target.value; d.querySelector(".l-sub").textContent = fmt(lineTotal(ln)); updTotal(); }
      });
      box.addEventListener("click", (e) => {
        const [ln, d] = lineOf(e.target); if (!ln) return;
        if (e.target.closest(".l-remove")) { lines.splice(+d.dataset.i, 1); renderLines(); return; }
        const step = e.target.closest(".l-minus") ? -1 : e.target.closest(".l-plus") ? 1 : 0;
        if (step) {
          ln.qty = Math.max(1, ln.qty + step);
          d.querySelector(".n").textContent = ln.qty; d.querySelector(".l-sub").textContent = fmt(lineTotal(ln)); updTotal();
        }
      });
      let payment = head.payment;
      $("#s-pay").addEventListener("click", (e) => {
        const b = e.target.closest("[data-pay]"); if (!b) return;
        payment = b.dataset.pay;
        $("#s-pay").querySelectorAll("[data-pay]").forEach((x) => x.setAttribute("aria-checked", String(x === b)));
      });
      // Each scan adds that plushie at its default price, or one more if it's already in the sale
      $("#s-scan").addEventListener("click", () => openScanner("Scan plushie tags", (code) => {
        const p = productByBarcode(code);
        if (!p) return `No plushie has barcode ${code}. Add it to the plushie in Products.`;
        const price = p.price || p.price === 0 ? p.price : "";
        let ln = lines.find((l) => l.productId === p.id);
        if (ln) ln.qty++;
        else {
          ln = lines.find((l) => !l.productId || (l.productId === "__new" && !l.newName.trim()));
          if (ln) Object.assign(ln, { productId: p.id, price, newName: "", qty: 1 });
          else lines.push((ln = { productId: p.id, qty: 1, price, newName: "" }));
        }
        renderLines();
        if (navigator.vibrate) navigator.vibrate(60);
        const units = lines.reduce((n, l) => n + l.qty, 0);
        return `Added ${p.name}${ln.qty > 1 ? ` (×${ln.qty})` : ""} · ${units} plushie${units === 1 ? "" : "s"}, ${fmt(lines.reduce((n, l) => n + lineTotal(l), 0))}`;
      }));
      $("#s-addline").addEventListener("click", () => {
        lines.push(blankLine()); renderLines();
        const sel = box.querySelectorAll(".l-product")[lines.length - 1]; sel.focus();
        sel.scrollIntoView({ block: "nearest" });
      });

      $("#s-event").addEventListener("change", () => {
        const v = $("#s-event").value, ev = eventById(v);
        $("#s-newev-wrap").hidden = v !== "__new";
        if (v === "__new") $("#s-newev").focus();
        if (v) $("#s-channel").value = "Craft fair";
        // Picking an event on other days moves the sale date into it
        if (ev) { const d = $("#s-date").value; if (!d || d < ev.start || d > evEnd(ev)) $("#s-date").value = todayStr() >= ev.start && todayStr() <= evEnd(ev) ? todayStr() : ev.start; }
      });
      $("#s-cancel").addEventListener("click", closeSheet);

      $("#sform").addEventListener("submit", async (e) => {
        e.preventDefault();
        const rows = box.querySelectorAll(".line"), which = (i) => (lines.length > 1 ? ` for plushie ${i + 1}` : "");
        for (const [i, ln] of lines.entries()) {
          if (!ln.productId) { rows[i].querySelector(".l-product").focus(); toast(`Choose a plushie${which(i)}.`); return; }
          if (ln.productId === "__new" && !ln.newName.trim()) { rows[i].querySelector(".l-newname").focus(); toast(`Type the new plushie's name${which(i)}.`); return; }
          if (String(ln.price).trim() === "" || !(Number(ln.price) >= 0)) { rows[i].querySelector(".l-pricein").focus(); toast(`Enter the price${which(i)}.`); return; }
        }
        const date = $("#s-date").value || todayStr(), channel = $("#s-channel").value, note = $("#s-note").value.trim();
        let eventId = $("#s-event").value, eventName = "";
        if (eventId === "__new" && !$("#s-newev").value.trim()) { $("#s-newev").focus(); toast("Give the new event a name."); return; }
        $("#s-save").disabled = true;
        const fail = () => { $("#s-save").disabled = false; };
        if (eventId === "__new") {
          eventName = $("#s-newev").value.trim(); eventId = uid();
          if (!(await api.saveEvent(eventId, { name: eventName, start: date, end: date, location: "", fee: 0, notes: "", createdAt: Date.now() }))) return fail();
        } else if (eventId) {
          eventName = (eventById(eventId) || {}).name || head.eventName || "";
        }
        // Plushies typed in at the booth: reuse one with the same name, or add it to Products (none left in stock)
        const created = new Map();
        for (const ln of lines) {
          if (ln.productId !== "__new") continue;
          const name = ln.newName.trim(), key = name.toLowerCase();
          let p = state.products.find((x) => (x.name || "").trim().toLowerCase() === key) || created.get(key);
          if (!p) {
            p = { id: uid(), name, price: round2(ln.price), cost: 0, stock: 0, hours: 0, notes: "", color: YARN[Math.floor(Math.random() * 8)], createdAt: Date.now() };
            const { id, ...pdata } = p;
            if (!(await api.saveProduct(id, pdata))) return fail();
            created.set(key, p);
          }
          ln.productId = p.id; ln.made = p;
        }
        // Save each line; stock: give back what the sale had, take what it has now (imported sales never touch stock)
        const orderId = isNew ? uid() : first.orderId || first.id;
        const now = Date.now(), keep = new Set(), delta = new Map();
        const addDelta = (pid, d) => delta.set(pid, (delta.get(pid) || 0) + d);
        if (!isNew && !imported) for (const x of orig) addDelta(x.productId, x.qty || 0);
        for (const [i, ln] of lines.entries()) {
          const p = ln.made || productById(ln.productId);
          const prev = ln.docId ? orig.find((x) => x.id === ln.docId) : null;
          const unitPrice = round2(ln.price);
          const data = {
            productId: ln.productId, productName: p ? p.name : ln.productName || "", color: p ? p.color || "" : ln.color || "",
            qty: ln.qty, unitPrice, total: round2(ln.qty * unitPrice), unitCost: p ? p.cost || 0 : ln.unitCost || 0,
            date, channel, eventId, eventName, note, payment, orderId, createdAt: (prev && prev.createdAt) || now + i,
          };
          if (first && first.example) data.example = true;
          if (imported) data.imported = true;
          const id = ln.docId || uid(); keep.add(id);
          if (!(await api.saveSale(id, data))) return fail();
          if (!imported) addDelta(ln.productId, -ln.qty);
        }
        if (!isNew) for (const x of orig) if (!keep.has(x.id)) await api.deleteSale(x.id);
        for (const [pid, d] of delta) {
          const p = productById(pid);
          if (d && p && ![...created.values()].some((c) => c.id === pid)) await api.patchProduct(pid, { stock: Math.max(0, (p.stock || 0) + d) });
        }
        closeSheet();
        const units = lines.reduce((n, ln) => n + ln.qty, 0), total = lines.reduce((n, ln) => n + lineTotal(ln), 0);
        toast(isNew ? `Sale saved · ${units > 1 ? `${units} plushies · ` : ""}${fmt(total)}` : "Sale updated");
      });

      if (!isNew) armDelete($("#s-del"), "Delete sale", async () => {
        for (const x of orig) if (!(await api.deleteSale(x.id))) return;
        let back = false;
        if (!imported) {
          const qty = new Map();
          for (const x of orig) qty.set(x.productId, (qty.get(x.productId) || 0) + (x.qty || 0));
          for (const [pid, q] of qty) { const p = productById(pid); if (p) { await api.patchProduct(pid, { stock: (p.stock || 0) + q }); back = true; } }
        }
        closeSheet(); toast(back ? "Sale deleted and stock put back" : "Sale deleted");
      });
    });
  }

  async function clearExamples() {
    const btn = document.getElementById("clear-ex"); if (btn) btn.disabled = true;
    for (const s of state.sales.filter((x) => x.example)) await api.deleteSale(s.id);
    for (const p of state.products.filter((x) => x.example)) await api.deleteProduct(p.id);
    for (const ev of state.events.filter((x) => x.example)) await api.deleteEvent(ev.id);
    toast("Examples removed");
  }

  const CSV_HEAD = ["Date", "Plushie", "Quantity", "Price each", "Total", "Paid with", "Materials each", "Sold through", "Event", "Note"];
  const toCSV = (rows) => {
    const q = (v) => { const s = String(v ?? ""); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    return rows.map((r) => r.map(q).join(",")).join("\r\n") + "\r\n";
  };
  function downloadCSV() {
    const rows = [CSV_HEAD];
    for (const s of state.sales) {
      const p = productById(s.productId);
      rows.push([s.date, p ? p.name : s.productName, s.qty, (s.unitPrice || 0).toFixed(2), (s.total || 0).toFixed(2), s.payment || "", (s.unitCost || 0).toFixed(2), s.channel, saleEventName(s), s.note]);
    }
    downloadFile(toCSV(rows), `plushie-sales-${todayStr()}.csv`);
  }

  // ---------- Printing tags ----------
  // One tag design, as SVG in tags/ (size comes from the SVG's width/height).
  // The front is per plushie: the app fills <text id="name">, <text id="price"> and draws the QR code in <rect id="qr">.
  // The back is the same on every tag. Fronts print first; the same sheets go back in for the backs.
  // Tags sit edge to edge in a centered grid, so the backs land on the fronts and she cuts straight across the sheet.
  const TAG = { front: "tags/tag-front.svg", back: "tags/tag-back.svg" };
  const SHEET = { w: 8.5, h: 11, margin: 0.25, gap: 0 };
  const svgCache = {};
  function tagArt(url) {
    if (!svgCache[url]) svgCache[url] = fetch(url).then((r) => { if (!r.ok) throw new Error("tag art " + url); return r.text(); })
      .catch((e) => { delete svgCache[url]; throw e; });
    return svgCache[url];
  }
  function toInches(v) {
    const m = /^\s*([\d.]+)\s*(in|mm|cm|pt|px)?\s*$/.exec(v || "");
    if (!m) return 0;
    return +m[1] / ({ in: 1, mm: 25.4, cm: 2.54, pt: 72, px: 96 }[m[2] || "px"]);
  }
  const priceLabel = (n) => "$" + (Math.round(n) === +n ? String(Math.round(n)) : (+n).toFixed(2));
  function sheetGrid(w, h) {
    const cols = Math.max(1, Math.floor((SHEET.w - 2 * SHEET.margin + SHEET.gap) / (w + SHEET.gap)));
    const rows = Math.max(1, Math.floor((SHEET.h - 2 * SHEET.margin + SHEET.gap) / (h + SHEET.gap)));
    const x0 = (SHEET.w - (cols * w + (cols - 1) * SHEET.gap)) / 2, y0 = (SHEET.h - (rows * h + (rows - 1) * SHEET.gap)) / 2;
    return { cols, rows, per: cols * rows, x0, y0 };
  }
  async function tagSize() {
    const svg = new DOMParser().parseFromString(await tagArt(TAG.front), "image/svg+xml").documentElement;
    return { w: toInches(svg.getAttribute("width")), h: toInches(svg.getAttribute("height")) };
  }
  const setText = (el, v) => { (el.querySelector("tspan") || el).textContent = v; };
  function fillFront(svg, p) {
    const name = svg.querySelector("#name"), price = svg.querySelector("#price"), slot = svg.querySelector("#qr");
    if (name) {
      // Long names shrink a little, then squeeze to fit the tag's width
      const n = p.name || "", size = +name.getAttribute("font-size") || 11, room = 120;
      const fs = n.length > 20 ? size * 0.85 : size;
      name.setAttribute("font-size", fs);
      setText(name, n);
      if (n.length * fs * 0.55 > room) { name.setAttribute("textLength", room); name.setAttribute("lengthAdjust", "spacingAndGlyphs"); }
    }
    if (price) {
      const label = priceLabel(p.price || 0);
      if (label.length > 4) price.setAttribute("font-size", (+price.getAttribute("font-size") || 28) * 0.72);
      setText(price, label);
    }
    if (slot && p.barcode) {
      const sx = +slot.getAttribute("x") || 0, sy = +slot.getAttribute("y") || 0;
      const size = Math.min(+slot.getAttribute("width") || 0, +slot.getAttribute("height") || 0);
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", qrPath(p.barcode, sx, sy, size)); path.setAttribute("fill", "#000");
      path.setAttribute("shape-rendering", "crispEdges");
      if (slot.getAttribute("transform")) path.setAttribute("transform", slot.getAttribute("transform"));
      slot.after(path);
    }
  }

  // Printable sheets. items: one plushie per front tag; for backs, pass the number of tags.
  async function buildTagPages(side, items, opts = {}) {
    const art = await tagArt(side === "front" ? TAG.front : TAG.back);
    if (side === "front") await loadScript(QR_LIB);
    const base = new DOMParser().parseFromString(art, "image/svg+xml").documentElement;
    const w = toInches(base.getAttribute("width")), h = toInches(base.getAttribute("height"));
    if (!w || !h) throw new Error("Tag art needs a width and height");
    const g = sheetGrid(w, h), list = side === "front" ? items : Array(items).fill(null);
    const back = side === "back", dx = back ? (opts.dx || 0) / 25.4 : 0, dy = back ? (opts.dy || 0) / 25.4 : 0;
    const pages = [];
    const line = (page, x, y, lw, lh) => {
      const d = document.createElement("div"); d.className = "crop";
      Object.assign(d.style, { left: x + "in", top: y + "in", width: lw + "in", height: lh + "in" }); page.appendChild(d);
    };
    list.forEach((p, i) => {
      if (i % g.per === 0) {
        const pg = document.createElement("div"); pg.className = "print-page"; pages.push(pg);
        // Cut marks in the margins, on every cut line (only on fronts; backs are printed over them)
        if (!back) {
          const t = 0.007, L = 0.14, o = 0.04, gw = g.cols * w + (g.cols - 1) * SHEET.gap, gh = g.rows * h + (g.rows - 1) * SHEET.gap;
          const xs = new Set(), ys = new Set();
          for (let c = 0; c < g.cols; c++) { xs.add(g.x0 + c * (w + SHEET.gap)); xs.add(g.x0 + c * (w + SHEET.gap) + w); }
          for (let r = 0; r < g.rows; r++) { ys.add(g.y0 + r * (h + SHEET.gap)); ys.add(g.y0 + r * (h + SHEET.gap) + h); }
          for (const x of xs) { line(pg, x - t / 2, g.y0 - o - L, t, L); line(pg, x - t / 2, g.y0 + gh + o, t, L); }
          for (const y of ys) { line(pg, g.x0 - o - L, y - t / 2, L, t); line(pg, g.x0 + gw + o, y - t / 2, L, t); }
        }
      }
      const page = pages[pages.length - 1], k = i % g.per;
      const x = g.x0 + (k % g.cols) * (w + SHEET.gap) + dx, y = g.y0 + Math.floor(k / g.cols) * (h + SHEET.gap) + dy;
      const svg = document.importNode(base, true);
      svg.setAttribute("width", w + "in"); svg.setAttribute("height", h + "in");
      svg.classList.add("tag");
      Object.assign(svg.style, { left: x + "in", top: y + "in", transform: back && opts.flip ? "rotate(180deg)" : "" });
      if (p) fillFront(svg, p);
      svg.querySelectorAll("[id]").forEach((el) => el.removeAttribute("id")); // many copies on a page
      page.appendChild(svg);
    });
    return { pages, grid: g, w, h };
  }

  async function printPages(pages) {
    let root = document.getElementById("print-root");
    if (!root) { root = document.createElement("div"); root.id = "print-root"; document.body.appendChild(root); }
    root.replaceChildren(...pages);
    // The tag's fixed text is outlines; only the name and price use a font (Yu Gothic where installed, else Zen Kaku Gothic New)
    await document.fonts.load("500 20px 'Zen Kaku Gothic New'", "$0123456789 Plushie").catch(() => {});
    await document.fonts.ready;
    window.addEventListener("afterprint", () => root.replaceChildren(), { once: true });
    window.print();
  }

  function tagSheet() {
    const saved = state.settings.tagPrint || {};
    const opts = { dx: saved.dx || 0, dy: saved.dy || 0, flip: !!saved.flip };
    const products = state.products.slice().sort((a, b) => (a.name || "").localeCompare(b.name || ""));
    // Starts from the saved print list; changes here are saved back to it
    const qty = new Map(products.filter((p) => p.price).map((p) => [p.id, queued(p.id)]));
    const total = () => [...qty.values()].reduce((n, v) => n + v, 0);
    openSheet(`
      <h3>Print tags</h3>
      <p class="hint"><b>1.</b> Check the print list below (tags added with “+ Add tag” on a plushie are already here) and print the <b>fronts</b> on cardstock.
        <b>2.</b> Put the printed sheets back in the printer and print the <b>backs</b> on the other side.
        <b>3.</b> Cut along the marks, punch the hole at the light circle, then tap <b>Clear list</b>.
        Print at 100% (“Actual size”). Try plain paper first to check the backs line up.</p>
      <div class="f"><span style="display:flex;justify-content:space-between;align-items:baseline;gap:12px">Print list
        <span style="display:flex;gap:14px"><button type="button" class="linkbtn" id="t-stock">Match stock</button><button type="button" class="linkbtn" id="t-clear">Clear list</button></span></span></div>
      <div class="rows" id="t-list">${products.length ? products.map((p) => `

          <div class="stepper"><button type="button" data-d="-1" aria-label="One fewer tag">−</button><span class="n num">${qty.get(p.id) || 0}</span><button type="button" data-d="1" aria-label="One more tag" ${p.price ? "" : "disabled"}>+</button></div>
        </div>`).join("") : `<div class="empty">Add plushies on the Products tab first.</div>`}</div>
      <div class="imp-box info num" id="t-sum" style="margin-top:12px"></div>
      <details class="t-align"><summary>Backs don't line up?</summary>
        <div class="fgrid" style="margin-top:10px">
          <label class="f">Move backs right (mm)<input id="t-dx" type="number" inputmode="decimal" step="0.5" value="${opts.dx}"></label>

          <label class="full" style="display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" id="t-flip" style="width:auto" ${opts.flip ? "checked" : ""}> Backs come out upside down: turn them around</label>

      <div class="t-tabs pay-pills" id="t-view" role="radiogroup" style="margin-top:12px">
        <button type="button" role="radio" data-view="front" aria-checked="true">Fronts</button><button type="button" role="radio" data-view="back" aria-checked="false">Backs</button>
      </div>
      <div class="t-preview" id="t-prev" aria-label="Preview of the first sheet"></div>
      <div class="actions">
        <button class="btn ghost" type="button" id="t-cancel">Close</button>
        <div class="right"><button class="btn" type="button" id="t-front">Print fronts</button><button class="btn ghost" type="button" id="t-back">Print backs</button></div>
      </div>`, (el) => {
      const $ = (s) => el.querySelector(s);
      let per = 20, view = "front", timer;
      const readOpts = () => { opts.dx = Number($("#t-dx").value) || 0; opts.dy = Number($("#t-dy").value) || 0; opts.flip = $("#t-flip").checked; };
      const frontList = () => products.flatMap((p) => Array(qty.get(p.id) || 0).fill(p));
      const sheets = () => Math.max(1, Math.ceil(total() / per));
      // Plushies without a code get the next PL- number, so their tags can be scanned
      const ensureCodes = async () => {

        for (const p of products) if ((qty.get(p.id) || 0) && !p.barcode) { p.barcode = "PL-" + String(n++).padStart(4, "0"); await api.patchProduct(p.id, { barcode: p.barcode }); }
      };
      const summary = async () => {

      $("#t-list").addEventListener("click", (e) => {
        const b = e.target.closest("[data-d]"); if (!b) return;
        const pid = b.closest("[data-pid]").dataset.pid;

      });
      $("#t-stock").addEventListener("click", () => { for (const p of products) if (p.price) setQty(p.id, p.stock || 0); refresh(); });
      $("#t-view").addEventListener("click", (e) => {

      $("#t-cancel").addEventListener("click", closeSheet);

      $("#t-front").addEventListener("click", async () => {
        if (!total()) { toast("Pick how many tags to print first."); return; }
        remember(); await ensureCodes();
        try { const { pages } = await buildTagPages("front", frontList()); await printPages(pages); }
        catch (e) { console.error(e); toast("Couldn't prepare the tags. Check the internet connection."); }
      });
      $("#t-back").addEventListener("click", async () => {
        remember();
        // The back is the same on every tag, so print whole sheets to match the fronts
        try { const { pages } = await buildTagPages("back", sheets() * per, opts); await printPages(pages); }
        catch (e) { console.error(e); toast("Couldn't prepare the tags. Check the internet connection."); }
      });

    });
  }

  // ---------- CSV import ----------
  // Reads the same columns Download CSV writes, plus common variations, from files saved by Excel or Google Sheets.
  const IMPORT_COLS = {
    date: ["date", "day", "sale date", "sold on", "date sold"],
    product: ["plushie", "product", "item", "name", "design", "plushie name", "product name"],
    qty: ["quantity", "qty", "how many", "count", "units", "number sold", "#"],
    unitPrice: ["price each", "unit price", "price", "each", "price per"],
    total: ["total", "amount", "sale total", "revenue", "total price"],
    unitCost: ["materials each", "materials", "materials cost", "material cost", "cost", "unit cost"],
    channel: ["sold through", "channel", "source", "sold via"],
    event: ["event", "show", "craft show", "event name", "show name", "fair", "market", "location", "venue", "where", "sold at", "where sold"],
    note: ["note", "notes", "comment", "comments", "buyer", "details"],
    payment: ["paid with", "payment", "payment method", "paid by", "method", "tender", "pay"],
  };

  function decodeText(buf) {
    // Excel's plain "CSV" is Windows-1252; "CSV UTF-8" and Google Sheets are UTF-8
    let t;
    try { t = new TextDecoder("utf-8", { fatal: true }).decode(buf); } catch (e) { t = new TextDecoder("windows-1252").decode(buf); }
    return t.replace(/^﻿/, "");
  }

  function parseCSV(text) {
    const firstLine = text.split(/\r?\n/, 1)[0];
    const delim = [",", ";", "\t"].map((d) => [d, firstLine.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
    const rows = []; let row = [], f = "", inQ = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQ) {
        if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else inQ = false; } else f += c;
      } else if (c === '"') inQ = true;
      else if (c === delim) { row.push(f); f = ""; }
      else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
      else f += c;
    }
    if (f !== "" || row.length) { row.push(f); rows.push(row); }
    return rows;
  }

  function parseDate(v) {
    v = String(v || "").trim();
    if (!v) return null;
    let y, m, d, mt;
    if ((mt = v.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/))) { y = +mt[1]; m = +mt[2]; d = +mt[3]; }
    else if ((mt = v.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2}|\d{4})$/))) {
      // US order (month/day) unless the first number can only be a day
      m = +mt[1]; d = +mt[2]; y = +mt[3];
      if (m > 12 && d <= 12) [m, d] = [d, m];
      if (y < 100) y += 2000;
    } else if (/^\d{5}(\.\d+)?$/.test(v)) {
      // Excel date serial number (days since 1899-12-30)
      const x = new Date(Date.UTC(1899, 11, 30) + Math.floor(Number(v)) * 864e5);
      y = x.getUTCFullYear(); m = x.getUTCMonth() + 1; d = x.getUTCDate();
    } else {
      // Written-out dates like "Mar 14, 2024" or "14 March 2024"
      if (!/[a-z]{3}/i.test(v) || !/\b\d{4}\b/.test(v)) return null;
      const x = new Date(v);
      if (isNaN(x)) return null;
      y = x.getFullYear(); m = x.getMonth() + 1; d = x.getDate();
    }
    const chk = new Date(y, m - 1, d);
    if (y < 1990 || y > 2100 || chk.getMonth() !== m - 1 || chk.getDate() !== d) return null;
    return y + "-" + String(m).padStart(2, "0") + "-" + String(d).padStart(2, "0");
  }

  function parseNum(v) {
    let s = String(v ?? "").replace(/[$€£\s]/g, "");
    if (!s) return null;
    let neg = false;
    if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
    s = /^-?\d+,\d{1,2}$/.test(s) ? s.replace(",", ".") : s.replace(/,/g, "");
    const n = Number(s);
    return isNaN(n) ? NaN : neg ? -n : n;
  }

  function buildImport(text) {
    const rows = parseCSV(text);
    const headIdx = rows.findIndex((r) => r.some((v) => v.trim()));
    if (headIdx < 0) return { error: "That file is empty." };
    const norm = (h) => h.toLowerCase().replace(/[^a-z0-9# ]/g, " ").replace(/\s+/g, " ").trim();
    const head = rows[headIdx].map(norm);
    const col = {};
    for (const [key, names] of Object.entries(IMPORT_COLS)) {
      const i = head.findIndex((h) => names.includes(h));
      if (i >= 0) col[key] = i;
    }
    if (col.date == null || col.product == null || (col.unitPrice == null && col.total == null)) {
      return { error: "Couldn't find the columns. The first row needs headings like Date, Plushie, Quantity and Price each (or Total). Use “Blank template” to get the right layout." };
    }
    const get = (r, k) => (col[k] == null ? "" : String(r[col[k]] ?? "").trim());
    const byName = new Map(state.products.map((p) => [(p.name || "").trim().toLowerCase(), p]));
    // Count what's already in the ledger so importing the same file twice doesn't double up
    const keyOf = (date, name, qty, total) => `${date}|${name.trim().toLowerCase()}|${qty}|${round2(total).toFixed(2)}`;
    const existing = new Map();
    for (const s of state.sales) {
      const p = productById(s.productId);
      const k = keyOf(s.date, p ? p.name : s.productName || "", s.qty, s.total);
      existing.set(k, (existing.get(k) || 0) + 1);
    }
    const evByName = new Map(state.events.map((x) => [(x.name || "").trim().toLowerCase(), x]));
    const ok = [], issues = [], newNames = new Map(), newEvents = new Map();
    let dups = 0;
    rows.slice(headIdx + 1).forEach((r, i) => {
      if (!r.some((v) => String(v).trim())) return;
      const line = headIdx + i + 2;
      const name = get(r, "product");
      if (!name) return issues.push({ line, why: "no plushie name" });
      const date = parseDate(get(r, "date"));
      if (!date) return issues.push({ line, why: get(r, "date") ? `can't read the date “${get(r, "date")}”` : "no date" });
      const rawQty = get(r, "qty"), q = rawQty ? parseNum(rawQty) : 1;
      if (!Number.isInteger(q) || q < 1) return issues.push({ line, why: `can't read the quantity “${rawQty}”` });
      let price = parseNum(get(r, "unitPrice")), total = parseNum(get(r, "total"));
      if (Number.isNaN(price) || Number.isNaN(total)) return issues.push({ line, why: "can't read the price" });
      if (price == null && total == null) return issues.push({ line, why: "no price or total" });
      if (price == null) price = total / q;
      if (total == null) total = q * price;
      price = round2(price); total = round2(total);
      const cost = parseNum(get(r, "unitCost"));
      const rawCh = get(r, "channel"), event = get(r, "event");
      const channel = CHANNELS.find((c) => c.toLowerCase() === rawCh.toLowerCase()) || rawCh || (event ? "Craft fair" : "Other");
      const k = keyOf(date, name, q, total);
      if (existing.get(k) > 0) { existing.set(k, existing.get(k) - 1); dups++; return; }
      const lower = name.toLowerCase();
      if (!byName.has(lower) && !newNames.has(lower)) newNames.set(lower, { name, price });
      const evLower = event.toLowerCase();
      if (event && !evByName.has(evLower)) {
        // New event spans the dates of its sales in the file
        const ne = newEvents.get(evLower) || { name: event, start: date, end: date };
        if (date < ne.start) ne.start = date;
        if (date > ne.end) ne.end = date;
        newEvents.set(evLower, ne);
      }
      ok.push({ date, name, qty: q, unitPrice: price, total, unitCost: Number.isFinite(cost) ? round2(cost) : null, channel, event, note: get(r, "note"),
        payment: (() => { const v = get(r, "payment"); return payMethods().find((m) => m.toLowerCase() === v.toLowerCase()) || v; })() });
    });
    ok.sort((a, b) => a.date.localeCompare(b.date));
    return { ok, issues, dups, newNames: [...newNames.values()], newEvents: [...newEvents.values()] };
  }

  function importSheet() {
    openSheet(`
      <h3>Import sales</h3>
      <p class="hint">Choose a CSV file. From Excel, use <b>File → Save As → CSV</b>. The first row should have the headings <code>Date, Plushie, Quantity, Price each</code>. <code>Total, Sold through, Event, Note</code> are optional. A file from “Download CSV” works as-is.</p>
      <p class="hint">Imported sales don't change your current stock counts.</p>
      <input class="vh" type="file" id="i-file" accept=".csv,text/csv,.txt,text/plain" tabindex="-1" aria-hidden="true">
      <div class="actions">
        <button class="btn ghost" type="button" id="i-template">Blank template</button>
        <div class="right"><button class="btn ghost" type="button" id="i-cancel">Cancel</button><button class="btn" type="button" id="i-pick">Choose file</button></div>
      </div>`, (el) => {
      el.querySelector("#i-cancel").addEventListener("click", closeSheet);
      el.querySelector("#i-template").addEventListener("click", () => downloadFile(toCSV([CSV_HEAD]), "plushie-sales-template.csv"));
      el.querySelector("#i-pick").addEventListener("click", () => el.querySelector("#i-file").click());
      el.querySelector("#i-file").addEventListener("change", async (e) => {
        const f = e.target.files && e.target.files[0]; e.target.value = "";
        if (!f) return;
        if (/\.xlsx?$/i.test(f.name)) { toast("That's an Excel workbook. In Excel, use File → Save As → CSV, then import that file."); return; }
        try {
          const plan = buildImport(decodeText(await f.arrayBuffer()));
          if (plan.error) { toast(plan.error); return; }
          importPreview(plan, f.name);
        } catch (ex) { console.error(ex); toast("Couldn't read that file."); }
      });
    });
  }

  function importPreview(plan, fileName) {
    const { ok, issues, dups, newNames, newEvents } = plan;
    const sum = ok.reduce((n, s) => n + s.total, 0);
    const range = ok.length ? (ok[0].date === ok[ok.length - 1].date ? dayLabel(ok[0].date) : `${dayLabel(ok[0].date)} – ${dayLabel(ok[ok.length - 1].date)}`) : "";
    const span = ok.length && ok[0].date.slice(0, 4) !== ok[ok.length - 1].date.slice(0, 4)
      ? `${ok[0].date.slice(0, 4)} – ${ok[ok.length - 1].date.slice(0, 4)}` : ok.length ? ok[0].date.slice(0, 4) : "";
    const shown = ok.slice(0, 8);
    openSheet(`
      <h3>Import sales</h3>
      <div class="imp-sum">${ok.length
        ? `<b class="num">${ok.length} sale${ok.length === 1 ? "" : "s"}</b> ready to add · <span class="num">${fmt(sum)}</span><div class="sub" style="color:var(--muted);font-size:.85rem">${esc(range)}, ${esc(span)} · from ${esc(fileName)}</div>`
        : `No new sales to add from ${esc(fileName)}.`}</div>
      ${dups ? `<div class="imp-box info">${dups} sale${dups === 1 ? " is" : "s are"} already in the ledger and will be skipped.</div>` : ""}
      ${issues.length ? `<div class="imp-box warn"><b>${issues.length} row${issues.length === 1 ? "" : "s"} can't be imported</b>
        <ul>${issues.slice(0, 8).map((x) => `<li>Row ${x.line}: ${esc(x.why)}</li>`).join("")}${issues.length > 8 ? `<li>…and ${issues.length - 8} more</li>` : ""}</ul>
        <div style="margin-top:6px">Fix those rows in the file and import it again. Sales already imported are skipped, so nothing gets doubled.</div></div>` : ""}
      ${newNames.length && ok.length ? `<div class="imp-box info"><label><input type="checkbox" id="i-addnew" checked>
        <span>Also add ${newNames.length} plushie${newNames.length === 1 ? "" : "s"} to Products (with 0 in stock): ${newNames.slice(0, 6).map((n) => esc(n.name)).join(", ")}${newNames.length > 6 ? `, and ${newNames.length - 6} more` : ""}</span></label></div>` : ""}
      ${newEvents.length && ok.length ? `<div class="imp-box info"><label><input type="checkbox" id="i-addev" checked>
        <span>Also add ${newEvents.length} event${newEvents.length === 1 ? "" : "s"} to Events: ${newEvents.slice(0, 6).map((n) => esc(n.name)).join(", ")}${newEvents.length > 6 ? `, and ${newEvents.length - 6} more` : ""}</span></label></div>` : ""}
      ${ok.length ? `<div class="imp-scroll"><table class="imp-table num">
        <thead><tr><th>Date</th><th>Plushie</th><th class="r">Qty</th><th class="r">Total</th><th>Where</th></tr></thead>
        <tbody>${shown.map((s) => `<tr><td>${esc(s.date)}</td><td>${esc(s.name)}</td><td class="r">${s.qty}</td><td class="r">${fmt(s.total)}</td><td>${esc(s.event || s.channel)}</td></tr>`).join("")}</tbody>
      </table>${ok.length > shown.length ? `<div class="empty">…and ${ok.length - shown.length} more</div>` : ""}</div>` : ""}
      <div class="actions">
        <button class="btn ghost" type="button" id="i-back">Choose another file</button>
        <div class="right"><button class="btn ghost" type="button" id="i-cancel">Cancel</button>
        ${ok.length ? `<button class="btn" type="button" id="i-go">Import ${ok.length} sale${ok.length === 1 ? "" : "s"}</button>` : ""}</div>
      </div>`, (el) => {
      el.querySelector("#i-cancel").addEventListener("click", closeSheet);
      el.querySelector("#i-back").addEventListener("click", importSheet);
      const go = el.querySelector("#i-go");
      if (go) go.addEventListener("click", async () => {
        go.disabled = true;
        const addNew = !!(el.querySelector("#i-addnew") && el.querySelector("#i-addnew").checked);
        const now = Date.now();
        const byName = new Map(state.products.map((p) => [(p.name || "").trim().toLowerCase(), p]));
        const products = [];
        if (addNew) newNames.forEach((n, i) => {
          const p = { id: uid(), name: n.name, price: n.price, cost: 0, stock: 0, hours: 0, notes: "Added by import", color: YARN[i % 8], createdAt: now };
          products.push(p); byName.set(n.name.toLowerCase(), p);
        });
        const evByName = new Map(state.events.map((x) => [(x.name || "").trim().toLowerCase(), x]));
        const events = [];
        if (el.querySelector("#i-addev") && el.querySelector("#i-addev").checked) newEvents.forEach((n) => {
          const ev = { id: uid(), name: n.name, start: n.start, end: n.end, location: "", fee: 0, notes: "Added by import", createdAt: now };
          events.push(ev); evByName.set(n.name.toLowerCase(), ev);
        });
        const sales = ok.map((s, i) => {
          const p = byName.get(s.name.toLowerCase()), ev = s.event ? evByName.get(s.event.toLowerCase()) : null;
          return {
            id: uid(), productId: p ? p.id : "", productName: p ? p.name : s.name, color: p ? p.color || "" : "",
            qty: s.qty, unitPrice: s.unitPrice, total: s.total, unitCost: s.unitCost ?? (p ? p.cost || 0 : 0),
            date: s.date, channel: s.channel, payment: s.payment, eventId: ev ? ev.id : "", eventName: ev ? ev.name : s.event,
            note: s.note, createdAt: now + i, imported: true,
          };
        });
        if (await api.importAll(products, sales, events)) {
          closeSheet(); state.tab = "sales"; state.filterProduct = ""; state.filterEvent = ""; render();
          toast(`Imported ${sales.length} sale${sales.length === 1 ? "" : "s"}`);
        } else go.disabled = false;
      });
    });
  }

  // ---------- Events ----------
  document.querySelector("nav.tabs").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-tab]"); if (!b) return;
    state.tab = b.dataset.tab; render(); window.scrollTo(0, 0);
  });
  document.getElementById("fab").addEventListener("click", () => saleSheet());
  const view = document.getElementById("view");
  view.addEventListener("click", (e) => {
    const t = e.target;
    const go = t.closest("[data-go]"); if (go) { state.tab = go.dataset.go; render(); window.scrollTo(0, 0); return; }
    if (t.closest("[data-act='new-product']")) return productSheet();
    if (t.closest("[data-act='clear-examples']")) return clearExamples();
    if (t.closest("[data-act='csv']")) return downloadCSV();
    if (t.closest("[data-act='import']")) return importSheet();
    if (t.closest("[data-act='new-event']")) return eventSheet();
    if (t.closest("[data-act='print-tags']")) return tagSheet();
    const ta = t.closest("[data-tag-add]");
    if (ta) {
      const p = productById(ta.dataset.tagAdd); if (!p) return;
      if (!p.price) { toast("Set a default price first; it prints on the tag."); return productSheet(p); }
      const n = queued(p.id) + 1; saveQueue({ [p.id]: n });
      return toast(`${p.name}: ${n} tag${n === 1 ? "" : "s"} in the print list`);
    }
    const ee = t.closest("[data-edit-event]"); if (ee) return eventSheet(eventById(ee.dataset.editEvent));
    const es = t.closest("[data-event-sales]");
    if (es) { state.filterEvent = es.dataset.eventSales; state.filterProduct = ""; state.tab = "sales"; render(); window.scrollTo(0, 0); return; }
    const ed = t.closest("[data-edit]"); if (ed) return productSheet(productById(ed.dataset.edit));
    const st = t.closest("[data-stock]");
    if (st) { const p = productById(st.dataset.stock); if (p) api.patchProduct(p.id, { stock: Math.max(0, (p.stock || 0) + Number(st.dataset.d)) }); return; }
    const sr = t.closest("[data-sale]");
    if (sr && !state.readOnly) { const s = state.sales.find((x) => x.id === sr.dataset.sale); if (s) saleSheet(orderLines(s)); }
  });
  view.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.matches("[data-sale]")) e.target.click();
  });
  view.addEventListener("input", (e) => { if (e.target.id === "q") { state.search = e.target.value; render(); } });
  // Payment methods manager (Sales tab)
  view.addEventListener("submit", (e) => {
    if (e.target.id !== "pay-add") return;
    e.preventDefault();
    const name = document.getElementById("pay-new").value.trim();
    if (!name) return;
    const list = payMethods();
    if (list.some((m) => m.toLowerCase() === name.toLowerCase())) { toast(`${name} is already in the list.`); return; }
    api.saveSettings({ paymentMethods: [...list, name] });
  });
  view.addEventListener("click", (e) => {
    const first = e.target.closest("[data-pay-first]"), rm = e.target.closest("[data-pay-remove]");
    if (first) { const m = first.dataset.payFirst; api.saveSettings({ paymentMethods: [m, ...payMethods().filter((x) => x !== m)] }); }
    if (rm) {
      const rest = payMethods().filter((x) => x !== rm.dataset.payRemove);
      if (!rest.length) { toast("Keep at least one payment method."); return; }
      api.saveSettings({ paymentMethods: rest }); toast(`${rm.dataset.payRemove} removed. Past sales keep it.`);
    }
  });
  view.addEventListener("change", (e) => {
    if (e.target.id === "filter-product") { state.filterProduct = e.target.value; render(); }
    if (e.target.id === "filter-event") { state.filterEvent = e.target.value; render(); }
  });

  render();
  connect();
}
</script>
</body>
</html>
