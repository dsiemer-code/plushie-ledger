<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plushie Ledger</title>
<meta name="theme-color" content="#7A4FA0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plushie Ledger">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Figtree:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@500&display=swap">
<style>
/* Layout: phone-first ledger — sticky header with yarn-stitch tabs, one column of panels, floating "Record sale" button; widens to two columns on desktop */
:root {
  --bg: #F5F3F7;
  --surface: #FFFFFF;
  --ink: #2A2233;
  --muted: #6D6477;
  --line: #E3DDE9;
  --accent: #7A4FA0;
  --accent-ink: #FFFFFF;
  --accent-soft: #EFE6F7;
  --good: #23806F;
  --warn: #B4621A;
  --warn-soft: #FBEBDD;
  --danger: #B3343F;
  --font-display: "Fredoka", "Nunito", ui-rounded, system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(42,34,51,.06), 0 4px 16px rgba(42,34,51,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17131C; --surface: #221C29; --ink: #EEE8F3; --muted: #A69CB1; --line: #362D40;
    --accent: #C39AE8; --accent-ink: #1E1525; --accent-soft: #33264141; --good: #5FC7B6;
    --warn: #F0A464; --warn-soft: #3A2A1E; --danger: #F07A84;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17131C; --surface: #221C29; --ink: #EEE8F3; --muted: #A69CB1; --line: #362D40;
  --accent: #C39AE8; --accent-ink: #1E1525; --accent-soft: #33264141; --good: #5FC7B6;
  --warn: #F0A464; --warn-soft: #3A2A1E; --danger: #F07A84;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
[hidden] { display: none !important; }
.head-right { display: flex; align-items: center; gap: 10px; }
.signin { max-width: 400px; margin: 8vh auto 0; display: grid; gap: 14px; }
.signin p { margin: 0; color: var(--muted); }
.signin .err { color: var(--danger); font-size: .9rem; min-height: 1.2em; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.num { font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 2px dashed var(--line);
}
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.head-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 10px; }
h1 { font-family: var(--font-display); font-weight: 600; font-size: 1.45rem; margin: 0; letter-spacing: .01em; display: flex; align-items: center; gap: 8px; }
h1 svg { flex: none; }
.sync { font-size: .78rem; color: var(--muted); }
nav.tabs { display: flex; gap: 4px; padding-block: 0 10px; }
nav.tabs button {
  flex: 1; border: 0; background: transparent; padding: 8px 10px; border-radius: 999px;
  font-weight: 600; color: var(--muted);
}
nav.tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }

main { padding-block: 18px 110px; display: grid; gap: 16px; }
.panel { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; min-width: 0; }
.panel h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; margin: 0 0 12px; text-wrap: balance; }
.label { text-transform: uppercase; letter-spacing: .07em; font-size: .7rem; font-weight: 700; color: var(--muted); }
.grid-2 { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .grid-2 { grid-template-columns: 1fr 1fr; } }

.banner { background: var(--warn-soft); color: var(--ink); border-radius: var(--radius); padding: 12px 14px; font-size: .9rem; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

/* Overview stats */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
.stat { min-width: 0; }
.stat .v { font-family: var(--font-display); font-size: 1.5rem; font-weight: 600; line-height: 1.15; margin-top: 2px; overflow-wrap: anywhere; }
.stat .d { font-size: .78rem; color: var(--muted); }
.stat .d.up { color: var(--good); }
.stat .d.down { color: var(--warn); }
.month-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 12px; }
.month-head h2 { margin: 0; }


.rows { display: grid; gap: 0; }
.row { display: flex; align-items: center; gap: 12px; padding-block: 10px; border-top: 1px solid var(--line); min-width: 0; }
.row:first-child { border-top: 0; }
.row .main { flex: 1; min-width: 0; }
.row .title { font-weight: 600; overflow-wrap: anywhere; }
.row .sub { font-size: .82rem; color: var(--muted); }
.row .amt { font-weight: 700; text-align: right; white-space: nowrap; }
.empty { color: var(--muted); font-size: .9rem; padding-block: 6px; }

.swatch { width: 34px; height: 34px; border-radius: 50%; flex: none; position: relative;
  background: var(--sw, #b9a3d0); box-shadow: inset 0 0 0 2px rgba(255,255,255,.35); }
.swatch::after { content: ""; position: absolute; inset: 6px; border-radius: 50%; border: 1.5px dashed rgba(255,255,255,.7); }
.swatch.lg { width: 48px; height: 48px; }
.thumb { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex: none; background: var(--line); }
.thumb.lg { width: 64px; height: 64px; border-radius: 12px; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }

/* Product photo */
.photo-edit { display: flex; gap: 14px; align-items: center; }
.photo-edit img, .photo-empty { width: 96px; height: 96px; border-radius: 12px; flex: none; }
.photo-edit img { object-fit: cover; }
.photo-empty { border: 2px dashed var(--line); display: grid; place-items: center; color: var(--muted); font-size: .78rem; text-align: center; padding: 8px; }
.photo-edit .opts { display: grid; gap: 6px; justify-items: start; }

/* Import */
.sheet p.hint { margin: 0 0 12px; color: var(--muted); font-size: .9rem; }
.sheet p.hint code { font-size: .82rem; }
.imp-sum { font-size: .95rem; margin-bottom: 10px; }
.imp-box { border-radius: 10px; padding: 10px 12px; font-size: .85rem; margin-bottom: 10px; }
.imp-box.warn { background: var(--warn-soft); }
.imp-box.info { background: var(--accent-soft); }
.imp-box ul { margin: 6px 0 0; padding-left: 18px; }
.imp-box label { display: flex; gap: 8px; align-items: flex-start; font-weight: 600; }
.imp-box input[type=checkbox] { width: auto; margin-top: 3px; }
.imp-scroll { overflow-x: auto; }
.imp-table { width: 100%; border-collapse: collapse; font-size: .82rem; }
.imp-table th { text-align: left; font-weight: 700; color: var(--muted); font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; padding: 4px 6px; }
.imp-table td { padding: 6px; border-top: 1px solid var(--line); white-space: nowrap; }
.imp-table td.r, .imp-table th.r { text-align: right; }

.chip { display: inline-block; font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.chip.low { background: var(--warn-soft); color: var(--warn); }
.chip.ex { background: transparent; border: 1px dashed var(--line); color: var(--muted); }

.showbars { display: grid; gap: 4px; }
.showbar { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: baseline; width: 100%; text-align: left; border: 0; background: none; padding: 8px 0; border-top: 1px solid var(--line); }
.showbar:first-child { border-top: 0; }
.showbar .nm { min-width: 0; display: grid; }
.showbar .title { font-weight: 600; overflow-wrap: anywhere; }
.showbar .sub { font-size: .78rem; color: var(--muted); }
.showbar .amt { font-weight: 700; }
.showbar .track { grid-column: 1 / -1; height: 8px; border-radius: 999px; background: var(--accent-soft); overflow: hidden; margin-top: 4px; }
.showbar .fill { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
.showbar:hover .title { color: var(--accent); }
.next-show { display: flex; align-items: center; gap: 12px; padding-block: 12px; border-left: 4px solid var(--accent); }
.next-show .main { flex: 1; min-width: 0; }
.next-show .title { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; overflow-wrap: anywhere; }
.next-show .sub { font-size: .82rem; color: var(--muted); }
h2.sect .yr { font-family: var(--font-body); font-weight: 500; font-size: .82rem; color: var(--muted); margin-left: 6px; }
h2.sect { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; margin: 6px 2px -4px; }

/* Products */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.toolbar .search { flex: 1 1 200px; }
.cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.pcard { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; display: grid; gap: 12px; min-width: 0; }
.pcard .top { display: flex; gap: 12px; align-items: flex-start; }
.pcard .top .main { flex: 1; min-width: 0; }
.pcard .name { font-family: var(--font-display); font-weight: 600; font-size: 1.08rem; line-height: 1.2; overflow-wrap: anywhere; }
.pcard .meta { font-size: .82rem; color: var(--muted); }
.pcard .bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 10px; border-top: 2px dashed var(--line); }
.pcard a.pattern { display: inline-flex; align-items: baseline; gap: 6px; margin-top: 6px; font-weight: 600; font-size: .88rem; color: var(--accent); text-decoration: none; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); max-width: 100%; }
.pcard a.pattern .host { font-weight: 500; font-size: .76rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.pcard .tag-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.pcard .tag-row .linkbtn { padding: 4px 0; font-size: .88rem; }
.stepper { display: inline-flex; align-items: center; gap: 4px; }
.stepper button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); font-size: 1.1rem; line-height: 1; }
.stepper .n { min-width: 2.2ch; text-align: center; font-weight: 700; }

/* Controls */
.btn { border: 0; border-radius: 999px; padding: 10px 16px; font-weight: 600; background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
.btn.small { padding: 6px 12px; font-size: .85rem; }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--line); }
.btn.danger.armed { background: var(--danger); color: #fff; border-color: var(--danger); }
.linkbtn { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 4px; }
input, select, textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
textarea { resize: vertical; min-height: 60px; }
label.f { display: grid; gap: 4px; font-size: .85rem; font-weight: 600; color: var(--muted); min-width: 0; }
.fgrid { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
.fgrid .full { grid-column: 1 / -1; }

.fab {
  position: fixed; z-index: 6;
  right: calc(18px + env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 6px 20px rgba(122,79,160,.35); padding: 14px 20px; font-size: 1rem;
  display: inline-flex; align-items: center; gap: 8px;
}

/* Sheet */
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(20,14,26,.45); display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 640px) { .overlay { align-items: center; } }
.sheet { background: var(--surface); width: 100%; max-width: 520px; max-height: 92%; overflow: auto;
  border-radius: 20px 20px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
@media (min-width: 640px) { .sheet { border-radius: 20px; } }
.sheet h3 { font-family: var(--font-display); font-weight: 600; font-size: 1.25rem; margin: 0 0 14px; }
.sheet .actions { display: flex; gap: 10px; justify-content: space-between; margin-top: 16px; flex-wrap: wrap; }
.sheet .actions .right { display: flex; gap: 10px; margin-left: auto; }
.colors { display: flex; gap: 8px; flex-wrap: wrap; }
.colors button { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; background: var(--sw); padding: 0; }
.colors button[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--surface) inset; }
.line-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.line-actions .btn { display: inline-flex; align-items: center; gap: 6px; }
.pay-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pay-pills button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 8px 14px; font-weight: 600; color: var(--ink); min-height: 40px; }
.pay-pills button[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* Barcodes */
.bc-field { display: grid; gap: 8px; }
.bc-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.bc-img { background: #fff; border-radius: 8px; width: 112px; height: 112px; justify-self: start; }
.scanner { position: fixed; inset: 0; z-index: 40; background: rgba(10,6,14,.85); display: flex; align-items: center; justify-content: center; padding: env(safe-area-inset-top, 0px) 12px env(safe-area-inset-bottom, 0px); }
.scan-box { background: var(--surface); border-radius: 18px; width: 100%; max-width: 480px; padding: 14px; display: grid; gap: 10px; }
.scan-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.scan-head b { font-family: var(--font-display); font-size: 1.1rem; }
#scan-view { width: 100%; min-height: 220px; border-radius: 12px; overflow: hidden; background: #000; }
#scan-view video { width: 100% !important; display: block; }
.scan-msg { font-weight: 600; min-height: 1.4em; }
.scan-type { display: flex; gap: 8px; }

/* Tag printing: pages are built in #print-root and only they print */
.t-preview { margin-top: 12px; width: 100%; overflow: hidden; border-radius: 8px; box-shadow: 0 0 0 1px var(--line); background: #fff; }
.t-preview .print-page { transform-origin: top left; }
.t-align summary { cursor: pointer; font-weight: 600; color: var(--accent); margin-top: 10px; }
.print-page { position: relative; width: 8.5in; height: 11in; overflow: hidden; background: #fff; color: #000; }
.print-page svg.tag { position: absolute; overflow: visible; }
.print-page .crop { position: absolute; background: #000; }
#print-root { display: none; }
@media print {
  @page { size: letter portrait; margin: 0; }
  html, body { background: #fff !important; }
  body::before { display: none !important; }
  body > *:not(#print-root) { display: none !important; }
  #print-root { display: block; }
  .print-page { break-after: page; page-break-after: always; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .print-page:last-child { break-after: auto; page-break-after: auto; }
}

/* Payment methods manager */
.pay-list { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.pay-chip { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); }
.pay-chip .nm { border: 0; background: none; padding: 6px 4px 6px 12px; font-weight: 600; }
.pay-chip .nm small { color: var(--muted); font-weight: 500; margin-left: 4px; }
.pay-chip .x { border: 0; background: none; width: 32px; height: 32px; font-size: 1.05rem; color: var(--muted); }
.pay-add { display: flex; gap: 8px; }

/* Sale lines (one per plushie) */
.line { border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 8px; margin-bottom: 8px; }
.line-top { display: flex; gap: 8px; align-items: center; }
.line-top select { flex: 1; min-width: 0; }
.l-remove { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); font-size: 1.2rem; line-height: 1; flex: none; }
.line-bottom { display: flex; align-items: center; gap: 8px; }
.l-price { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; color: var(--muted); font-weight: 600; }
.l-price input { min-width: 0; }
.l-price span { white-space: nowrap; }
.l-sub { font-weight: 700; min-width: 64px; text-align: right; }
.total-line { display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px; padding-top: 12px; border-top: 2px dashed var(--line); }
.total-line .v { font-family: var(--font-display); font-size: 1.4rem; font-weight: 600; }

.monthgroup h4 { margin: 0; display: flex; justify-content: space-between; gap: 8px; font-size: .95rem; padding-block: 4px 6px; }
.monthgroup + .monthgroup { margin-top: 14px; }
.salerow { cursor: pointer; }
.salerow:hover .title { color: var(--accent); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: .9rem; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: up .22s ease-out; }
  @keyframes up { from { transform: translateY(24px); opacity: .6; } }
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="head-row">
      <h1>
        <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11" fill="var(--accent)"/><path d="M5 10c4 2 12 2 16 0M4 14c5 2.5 13 2.5 18 0M6 18.5c4 1.6 10 1.6 14 0M10 3c-2 5-2 15 1 20M16 3c2 5 2 15-1 20" stroke="var(--surface)" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>
        Plushie Ledger
      </h1>
      <div class="head-right">
        <span class="sync" id="sync">Loading…</span>
        <button class="linkbtn" id="signout" type="button" hidden>Sign out</button>
      </div>
    </div>
    <nav class="tabs" role="tablist" id="tabs" hidden>
      <button role="tab" id="tab-overview" aria-selected="true" data-tab="overview">Overview</button>
      <button role="tab" id="tab-products" aria-selected="false" data-tab="products">Products</button>
      <button role="tab" id="tab-sales" aria-selected="false" data-tab="sales">Sales</button>
      <button role="tab" id="tab-events" aria-selected="false" data-tab="events">Events</button>
    </nav>
  </div>
</header>

<div class="wrap">
  <form class="signin panel" id="signin" hidden novalidate>
    <h2 style="margin:0">Sign in</h2>
    <p>Use the email and password set up for this shop.</p>
    <label class="f">Email<input id="si-email" type="email" autocomplete="username" required></label>
    <label class="f">Password<input id="si-pass" type="password" autocomplete="current-password" required></label>
    <div class="err" id="si-err"></div>
    <button class="btn" type="submit" id="si-go">Sign in</button>
  </form>
  <main id="view"></main>
</div>

<button class="btn fab" id="fab" type="button" hidden>
  <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 3v12M3 9h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
  Record sale
</button>
<div id="sheet-root"></div>
<div class="toast" id="toast" hidden></div>

<script type="module">
import { firebaseConfig } from "./firebase-config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, limit, writeBatch,
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

{
  const YARN = ["#E58FA6", "#F2B36B", "#E9D66B", "#8FC79A", "#6FB6C9", "#8A9BE0", "#B48BD6", "#C9A27E", "#9B9B9B", "#F4EFE6", "#4B4453"];
  const CHANNELS = ["Craft fair", "Etsy", "Instagram", "Custom order", "Friends & family", "Other"];
  const money = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });
  const money0 = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
  const fmt = (n) => money.format(n || 0);
  const fmtShort = (n) => (Math.abs(n) >= 1000 ? money0.format(n) : money.format(n || 0));
  const round2 = (n) => Math.round((Number(n) || 0) * 100) / 100;

  const DEFAULT_PAY = ["Cash", "Card"];
  const state = { tab: "overview", products: [], sales: [], events: [], settings: {}, loaded: { p: false, s: false, e: false }, filterProduct: "", filterEvent: "", search: "", readOnly: false, offline: false };

  // Local-only fallback when saving isn't available in this view
  const local = { products: [], sales: [], events: [], settings: {} };

  function todayStr() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function monthKey(dateStr) { return (dateStr || "").slice(0, 7); }
  function monthLabel(key, opts) {
    const [y, m] = key.split("-").map(Number);
    return new Date(y, m - 1, 1).toLocaleDateString("en-US", opts || { month: "long", year: "numeric" });
  }
  function dayLabel(dateStr) {
    const [y, m, d] = dateStr.split("-").map(Number);

  }
  function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  // Product photo if there is one, otherwise the yarn-color swatch
  function avatar(photo, color, big) {
    if (photo && /^data:image\//.test(photo)) return `<img class="thumb${big ? " lg" : ""}" src="${esc(photo)}" alt="">`;
    return `<span class="swatch${big ? " lg" : ""}" style="--sw:${esc(color || YARN[6])}"></span>`;
  }
  // Photos are shrunk and stored with the product in Firestore (no paid Storage plan needed)
  async function shrinkPhoto(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      const s = Math.min(1, 640 / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * s), h = Math.round(img.naturalHeight * s);
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
      let q = 0.8, out = c.toDataURL("image/jpeg", q);
      while (out.length > 200000 && q > 0.45) { q -= 0.1; out = c.toDataURL("image/jpeg", q); }
      return out;
    } finally { URL.revokeObjectURL(url); }
  }
  // Pattern links: web pages only, and "www.site.com/x" becomes "https://www.site.com/x"
  function cleanUrl(v) {
    let s = String(v || "").trim();
    if (!s) return "";
    if (!/^[a-z][a-z0-9+.-]*:/i.test(s)) s = "https://" + s.replace(/^\/+/, "");
    try { const u = new URL(s); return /^https?:$/.test(u.protocol) && u.hostname.includes(".") ? u.href : null; } catch (e) { return null; }
  }
  // ---------- Payment methods ----------
  // The first method in the list is the default on a new sale
  const payMethods = () => (Array.isArray(state.settings.paymentMethods) && state.settings.paymentMethods.length ? state.settings.paymentMethods : DEFAULT_PAY);
  function payBreakdown(list) {
    const m = new Map();
    for (const s of list) { const k = s.payment || "Not recorded"; m.set(k, round2((m.get(k) || 0) + (s.total || 0))); }
    return [...m.entries()].sort((a, b) => b[1] - a[1]).map(([k, v]) => `${esc(k)} ${fmt(v)}`).join(" · ");
  }

  // ---------- Print list ----------
  // How many tags are waiting to be printed for each plushie. Kept in settings so it syncs:
  // she can add tags from her phone as she finishes plushies and print them together later.
  const tagQueue = () => state.settings.tagQueue || {};
  const queued = (pid) => Math.max(0, Math.floor(+(tagQueue()[pid] || 0)));
  const queueTotal = () => state.products.reduce((n, p) => n + (p.price ? queued(p.id) : 0), 0);
  const saveQueue = (changes) => api.saveSettings({ tagQueue: { ...tagQueue(), ...changes } });

  // ---------- Barcodes ----------
  const SCAN_LIB = "https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js";
  const QR_LIB = "https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js";
  const libs = {};
  function loadScript(src) {
    if (!libs[src]) libs[src] = new Promise((res, rej) => {
      const s = document.createElement("script"); s.src = src; s.onload = res;
      s.onerror = () => { delete libs[src]; s.remove(); rej(new Error("script load failed")); };
      document.head.appendChild(s);
    });
    return libs[src];
  }
  const productByBarcode = (code) => state.products.find((p) => p.barcode && p.barcode.toLowerCase() === code.toLowerCase());
  function nextBarcode() {
    let n = 0;
    for (const p of state.products) { const m = /^PL-(\d+)$/.exec(p.barcode || ""); if (m) n = Math.max(n, +m[1]); }
    return "PL-" + String(n + 1).padStart(4, "0");
  }
  // Tags carry QR codes: they stay readable at about 1 cm, small enough for her square tag.
  // Returns the dark modules as one SVG path filling a size×size box at (x, y). Needs QR_LIB loaded.
  function qrPath(code, x, y, size) {
    const q = window.qrcode(0, "M"); q.addData(code); q.make();
    const n = q.getModuleCount(), m = size / n, f = (v) => +v.toFixed(3);
    let d = "";
    for (let r = 0; r < n; r++) {
      for (let c = 0; c < n; c++) {
        if (!q.isDark(r, c)) continue;
        let run = 1; while (c + run < n && q.isDark(r, c + run)) run++;
        d += `M${f(x + c * m)} ${f(y + r * m)}h${f(run * m)}v${f(m)}h${f(-run * m)}z`;
        c += run - 1;
      }
    }
    return d;
  }
  // Preview on the product screen (an <svg> has no .hidden property, so toggle the attribute)
  async function drawBarcode(svg, code) {
    if (!code) { svg.toggleAttribute("hidden", true); return; }
    try {
      await loadScript(QR_LIB);
      svg.setAttribute("viewBox", "-10 -10 120 120");
      svg.innerHTML = `<rect x="-10" y="-10" width="120" height="120" fill="#fff"/><path fill="#000" shape-rendering="crispEdges" d="${qrPath(code, 0, 0, 100)}"/>`;
      svg.toggleAttribute("hidden", false);
    } catch (e) { svg.toggleAttribute("hidden", true); }
  }

  // Camera scanner over the current screen. onCode(code) returns a message to show.
  // Hardware (Bluetooth) scanners type the code, so the box also takes typed codes.
  function openScanner(title, onCode, { once = false } = {}) {
    const root = document.createElement("div");
    root.className = "scanner";
    root.innerHTML = `<div class="scan-box" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="scan-head"><b>${esc(title)}</b><button class="btn small" type="button" id="scan-done">Done</button></div>
      <div id="scan-view"></div>
      <div class="scan-msg" id="scan-msg" role="status">Starting the camera…</div>
      <form class="scan-type" id="scan-type"><input id="scan-code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Or type the code" aria-label="Barcode"><button class="btn ghost small">Add</button></form>
    </div>`;
    document.body.appendChild(root);
    const msg = (t) => { root.querySelector("#scan-msg").textContent = t; };
    let scanner = null, closed = false, lastCode = "", lastAt = 0;
    const close = async () => {
      if (closed) return; closed = true;
      try { if (scanner && scanner.isScanning) await scanner.stop(); if (scanner) scanner.clear(); } catch (e) {}
      root.remove();
    };
    const got = (raw) => {
      const code = String(raw || "").trim(), now = Date.now();
      if (!code || closed) return;
      if (code === lastCode && now - lastAt < 2500) return; // the same tag still in view
      lastCode = code; lastAt = now;
      const r = onCode(code); if (r) msg(r);
      if (once) close();
    };
    root.querySelector("#scan-done").addEventListener("click", close);
    root.querySelector("#scan-type").addEventListener("submit", (e) => { e.preventDefault(); const i = root.querySelector("#scan-code"); lastCode = ""; got(i.value); i.value = ""; });
    (async () => {
      try {
        await loadScript(SCAN_LIB);
        if (closed) return;
        const L = window.__Html5QrcodeLibrary__, F = L.Html5QrcodeSupportedFormats;
        scanner = new L.Html5Qrcode("scan-view", {
          verbose: false,
          formatsToSupport: [F.CODE_128, F.QR_CODE, F.DATA_MATRIX, F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_39],
          experimentalFeatures: { useBarCodeDetectorIfSupported: true },
        });
        await scanner.start({ facingMode: "environment" },
          { fps: 10, qrbox: (w, h) => ({ width: Math.max(60, Math.floor(w * 0.85)), height: Math.max(60, Math.floor(h * 0.4)) }) },
          got, () => {});
        if (closed) { try { await scanner.stop(); scanner.clear(); } catch (e) {} return; }
        msg(once ? "Point the camera at the barcode." : "Point at a tag's barcode. Keep scanning, then tap Done.");
      } catch (e) {
        console.error(e);
        msg(/script load/.test(String(e && e.message)) ? "Couldn't load the scanner. Check the internet connection, or type the code below."
          : "Couldn't open the camera. Allow camera access for this site, or type the code below.");
      }
    })();
  }

  function downloadFile(text, name) {
    // BOM + CRLF so Excel opens it with the right characters and rows
    const blob = new Blob(["﻿" + text], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  let toastTimer;
  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 2600);
  }

  // ---------- Data layer ----------
  // Firestore keeps a copy on the device, so the app works offline and syncs when back online.
  // Writes show up on screen right away; we don't wait for the server, only report failures.
  const configured = firebaseConfig && firebaseConfig.apiKey && !String(firebaseConfig.apiKey).startsWith("PASTE");
  let fs = null, auth = null, uidPath = null, unsubs = [];

  function write(promiseFn) {
    try {
      promiseFn().catch((e) => {
        console.error(e);
        if (e && e.code === "permission-denied") toast("This account can't change the ledger.");
        else toast("That didn't save. Try again in a moment.");
      });
      return true;
    } catch (e) { console.error(e); toast("That didn't save. Try again in a moment."); return false; }
  }
  const ref = (col, id) => doc(fs, "users", uidPath, col, id);
  const api = {
    async saveProduct(id, data) {
      if (!fs) { const i = local.products.findIndex((p) => p.id === id); const rec = { id, ...data }; if (i >= 0) local.products[i] = rec; else local.products.push(rec); syncLocal(); return true; }
      return write(() => setDoc(ref("products", id), data));
    },
    async patchProduct(id, data) {
      if (!fs) { const p = local.products.find((p) => p.id === id); if (p) Object.assign(p, data); syncLocal(); return true; }
      return write(() => updateDoc(ref("products", id), data));
    },
    async deleteProduct(id) {
      if (!fs) { local.products = local.products.filter((p) => p.id !== id); syncLocal(); return true; }
      return write(() => deleteDoc(ref("products", id)));
    },
    async saveSale(id, data) {
      if (!fs) { const i = local.sales.findIndex((s) => s.id === id); const rec = { id, ...data }; if (i >= 0) local.sales[i] = rec; else local.sales.push(rec); syncLocal(); return true; }
      return write(() => setDoc(ref("sales", id), data));
    },
    async deleteSale(id) {
      if (!fs) { local.sales = local.sales.filter((s) => s.id !== id); syncLocal(); return true; }
      return write(() => deleteDoc(ref("sales", id)));
    },
    // Shop-wide settings (payment methods) live in one document
    async saveSettings(data) {
      if (!fs) { Object.assign(local.settings, data); syncLocal(); return true; }
      return write(() => setDoc(doc(fs, "users", uidPath, "settings", "shop"), data, { merge: true }));
    },
    async saveEvent(id, data) {
      if (!fs) { const i = local.events.findIndex((x) => x.id === id); const rec = { id, ...data }; if (i >= 0) local.events[i] = rec; else local.events.push(rec); syncLocal(); return true; }
      return write(() => setDoc(ref("events", id), data));
    },
    async deleteEvent(id) {
      if (!fs) { local.events = local.events.filter((x) => x.id !== id); syncLocal(); return true; }
      return write(() => deleteDoc(ref("events", id)));
    },
    // Many records at once, in batches (Firestore allows 500 writes per batch)
    async importAll(products, sales, events = []) {
      if (!fs) { local.products.push(...products); local.sales.push(...sales); local.events.push(...events); syncLocal(); return true; }
      const ops = [...products.map((p) => ["products", p]), ...events.map((x) => ["events", x]), ...sales.map((s) => ["sales", s])];
      let ok = true;
      for (let i = 0; i < ops.length; i += 450) {
        const b = writeBatch(fs);
        for (const [col, { id, ...data }] of ops.slice(i, i + 450)) b.set(ref(col, id), data);

    },

  function syncLocal() {

    render();
  }
  const saleSort = (a, b) => (b.date || "").localeCompare(a.date || "") || (b.createdAt || 0) - (a.createdAt || 0);

  function syncLabel(snap) {

    return snap.metadata.fromCache ? "Offline" : "Synced";
  }

  function showApp(on) {

    document.getElementById("fab").hidden = !on;

  }

  function connect() {
    if (!configured) {
      // Demo mode: nothing is saved until firebase-config.js is filled in.
      state.offline = true; state.loaded = { p: true, s: true, e: true };
      const m = (d) => { const x = new Date(); x.setDate(x.getDate() - d); return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0"); };
      local.products = [
        { id: "ex1", name: "Sleepy Axolotl", price: 28, cost: 6.5, stock: 4, hours: 3, color: YARN[0], notes: "Example entry", example: true },
        { id: "ex2", name: "Mushroom Frog", price: 22, cost: 4, stock: 1, hours: 2.5, color: YARN[3], notes: "Example entry", example: true },
        { id: "ex3", name: "Tiny Whale", price: 15, cost: 2.5, stock: 6, hours: 1.5, color: YARN[4], notes: "Example entry", example: true },
      ];
      const ex = (id, pid, qty, price, d, ch) => { const p = local.products.find((x) => x.id === pid); return { id, productId: pid, productName: p.name, color: p.color, qty, unitPrice: price, total: qty * price, unitCost: p.cost, date: m(d), channel: ch, note: "", createdAt: Date.now() - d * 864e5, example: true }; };
      local.sales = [ex("s1", "ex1", 1, 28, 2, "Craft fair"), ex("s2", "ex3", 3, 15, 2, "Craft fair"), ex("s3", "ex2", 1, 22, 2, "Craft fair"), ex("s4", "ex1", 2, 28, 120, "Craft fair"), ex("s5", "ex2", 1, 22, 120, "Craft fair")];
      const exEv = (id, name, from, to, location, fee) => ({ id, name, start: m(from), end: m(to), location, fee, notes: "Example entry", createdAt: Date.now() - 200 * 864e5, example: true });
      local.events = [
        exEv("ev0", "Summer Street Fair", 121, 120, "Main St", 40),

        exEv("ev2", "Holiday Makers Market", -21, -20, "Fairgrounds, Hall B", 60),
      ];
      local.products.forEach((p, i) => { p.barcode = "PL-000" + (i + 1); });
      local.sales.forEach((s, i) => { s.payment = i % 2 ? "Card" : "Cash"; });
      for (const s of local.sales) { const ev = local.events.find((x) => x.id === (s.id === "s4" || s.id === "s5" ? "ev0" : "ev1")); s.eventId = ev.id; s.eventName = ev.name; }

        state.events = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        state.loaded.e = true; setSync(syncLabel(snap)); render();

    document.getElementById("signin").addEventListener("submit", async (e) => {
      e.preventDefault();

        await signInWithEmailAndPassword(auth, document.getElementById("si-email").value.trim(), document.getElementById("si-pass").value);
      } catch (ex) {

  }

  // ---------- Derived ----------
  function productById(id) { return state.products.find((p) => p.id === id); }
  function eventById(id) { return id ? state.events.find((x) => x.id === id) : undefined; }
  const evEnd = (ev) => (ev.end && ev.end >= ev.start ? ev.end : ev.start);
  const evStatus = (ev, today = todayStr()) => (ev.start > today ? "upcoming" : evEnd(ev) < today ? "past" : "now");
  function evDates(ev) {
    const yr = ev.start.slice(0, 4) !== todayStr().slice(0, 4) ? ", " + ev.start.slice(0, 4) : "";
    return dayLabel(ev.start) + (evEnd(ev) !== ev.start ? " – " + dayLabel(evEnd(ev)) : "") + yr;
  }
  // Lines bought together share an orderId; older/imported lines are their own order
  function orderKey(s) { return s.orderId || s.id; }
  const entered = (a, b) => (a.createdAt || 0) - (b.createdAt || 0); // lines in the order she added them
  function orderLines(s) { const k = orderKey(s); return state.sales.filter((x) => orderKey(x) === k).sort(entered); }
  function groupOrders(list) {
    const m = new Map();
    for (const s of list) { const k = orderKey(s); if (!m.has(k)) m.set(k, []); m.get(k).push(s); }
    return [...m.values()].map((g) => g.sort(entered));
  }
  function eventTotals(ev) {
    let revenue = 0, units = 0, cost = 0;
    const orders = new Set();
    for (const s of state.sales) if (s.eventId === ev.id) { revenue += s.total || 0; units += s.qty || 0; cost += (s.unitCost || 0) * (s.qty || 0); orders.add(orderKey(s)); }
    return { revenue: round2(revenue), units, orders: orders.size, profit: round2(revenue - cost - (ev.fee || 0)) };
  }
  // Happening now first, then coming up (soonest first), then past (most recent first)
  function eventsInPickOrder() {
    const today = todayStr(), by = { now: [], upcoming: [], past: [] };
    for (const ev of state.events) by[evStatus(ev, today)].push(ev);
    by.now.sort((a, b) => a.start.localeCompare(b.start));
    by.upcoming.sort((a, b) => a.start.localeCompare(b.start));
    by.past.sort((a, b) => b.start.localeCompare(a.start));
    return by;
  }
  // "Sold through" of the most recent sale that wasn't at an event (e.g. Etsy between shows)
  function lastOffShowChannel() {
    let best = null;
    for (const s of state.sales) if (!s.imported && !s.eventId && (!best || (s.createdAt || 0) > (best.createdAt || 0))) best = s;
    return (best && best.channel) || CHANNELS[0];
  }
  const saleEventName = (s) => { const ev = eventById(s.eventId); return ev ? ev.name : s.eventName || ""; };
  function soldByProduct() {
    const m = new Map();
    for (const s of state.sales) {
      const k = s.productId || s.productName;
      const cur = m.get(k) || { name: s.productName, units: 0, revenue: 0, color: s.color };
      cur.units += s.qty || 0; cur.revenue += s.total || 0;
      const p = productById(s.productId); if (p) { cur.name = p.name; cur.color = p.color; cur.photo = p.photo; }
      m.set(k, cur);
    }
    return m;
  }
  const hasExamples = () => state.products.some((p) => p.example) || state.sales.some((s) => s.example) || state.events.some((x) => x.example);

  // ---------- Render ----------
  function render() {
    document.querySelectorAll("nav.tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === state.tab)));
    const v = document.getElementById("view");
    const active = document.activeElement && document.activeElement.id;
    const caret = active === "q" ? document.activeElement.selectionStart : null;
    let html = banners();
    if (!(state.loaded.p && state.loaded.s && state.loaded.e)) html += `<div class="panel"><div class="empty">Loading your shop…</div></div>`;
    else if (state.tab === "overview") html += overviewHTML();
    else if (state.tab === "products") html += productsHTML();
    else if (state.tab === "events") html += eventsHTML();
    else html += salesHTML();
    v.innerHTML = html;
    if (active === "q") { const q = document.getElementById("q"); if (q) { q.focus(); try { q.setSelectionRange(caret, caret); } catch (e) {} } }
  }

  function banners() {
    let h = "";
    if (state.offline) h += `<div class="banner">Demo mode: nothing is saved yet. Fill in firebase-config.js (see the README) to keep records and sync between devices.</div>`;
    if (hasExamples() && !state.readOnly) h += `<div class="banner"><span>The entries marked <span class="chip ex">Example</span> are samples to show how things look.</span><button class="btn small" data-act="clear-examples" id="clear-ex">Remove examples</button></div>`;
    return h;
  }

  // Sales come in a few shows a year, so totals are by year and by show rather than by month
  function yearTotals(y) {
    let revenue = 0, units = 0, cost = 0;
    for (const s of state.sales) if ((s.date || "").startsWith(y)) { revenue += s.total || 0; units += s.qty || 0; cost += (s.unitCost || 0) * (s.qty || 0); }
    const evs = state.events.filter((ev) => ev.start.startsWith(y) && ev.start <= todayStr());
    const fees = evs.reduce((n, ev) => n + (ev.fee || 0), 0);
    return { revenue: round2(revenue), units, profit: round2(revenue - cost - fees), shows: evs.length };
  }

  function overviewHTML() {
    const y = todayStr().slice(0, 4), cur = yearTotals(y), prev = yearTotals(String(+y - 1));
    const stats = `
      <section class="panel">
        <div class="month-head"><h2>${y} so far</h2><span class="label">${cur.shows} show${cur.shows === 1 ? "" : "s"}</span></div>
        <div class="stats num">
          <div class="stat"><div class="label">Sales</div><div class="v">${fmtShort(cur.revenue)}</div><span class="d">${prev.revenue ? `${fmtShort(prev.revenue)} in ${+y - 1}` : "&nbsp;"}</span></div>
          <div class="stat"><div class="label">Plushies sold</div><div class="v">${cur.units}</div><span class="d">${prev.units ? `${prev.units} in ${+y - 1}` : "&nbsp;"}</span></div>
          <div class="stat"><div class="label">After costs</div><div class="v">${fmtShort(cur.profit)}</div><span class="d">yarn & booth fees</span></div>
        </div>
      </section>`;

    // Recent shows side by side
    const shows = state.events.filter((ev) => evStatus(ev) !== "upcoming")
      .map((ev) => ({ ev, t: eventTotals(ev) })).filter((x) => x.t.orders)
      .sort((a, b) => b.ev.start.localeCompare(a.ev.start)).slice(0, 6);
    const max = Math.max(0, ...shows.map((x) => x.t.revenue));
    const chart = `
      <section class="panel">
        <div class="month-head"><h2>Sales by show</h2>${shows.length ? `<button class="linkbtn" data-go="events">All events</button>` : ""}</div>
        ${shows.length ? `<div class="showbars">${shows.map(({ ev, t }) => `
          <button class="showbar" data-event-sales="${esc(ev.id)}">
            <span class="nm"><span class="title">${esc(ev.name)}</span><span class="sub">${esc(evDates(ev))} · ${t.units} sold</span></span>
            <span class="amt num">${fmtShort(t.revenue)}</span>
            <span class="track"><span class="fill" style="width:${max ? Math.max(2, (t.revenue / max) * 100).toFixed(1) : 0}%"></span></span>
          </button>`).join("")}</div>`
          : `<div class="empty">Each show's total will show here once you record sales at it.</div>`}
      </section>`;

    // best sellers
    const top5 = [...soldByProduct().values()].sort((a, b) => b.units - a.units || b.revenue - a.revenue).slice(0, 5);
    const best = `
      <section class="panel">
        <h2>Best sellers</h2>
        <div class="rows">
          ${top5.length ? top5.map((p) => `
            <div class="row">${avatar(p.photo, p.color)}
              <div class="main"><div class="title">${esc(p.name)}</div><div class="sub num">${fmt(p.revenue)} total</div></div>
              <div class="amt num">${p.units} sold</div></div>`).join("") : `<div class="empty">No sales yet.</div>`}
        </div>
      </section>`;

    const low = state.products.filter((p) => (p.stock || 0) <= 1).sort((a, b) => (a.stock || 0) - (b.stock || 0));
    const lowHTML = `
      <section class="panel">
        <h2>Running low</h2>
        <div class="rows">
          ${low.length ? low.map((p) => `
            <div class="row">${avatar(p.photo, p.color)}
              <div class="main"><div class="title">${esc(p.name)}</div><div class="sub">${p.stock ? "Last one in stock" : "Sold out"}</div></div>
              <span class="chip low num">${p.stock || 0} left</span></div>`).join("") : `<div class="empty">${state.products.length ? "Everything has at least 2 in stock." : "Add your plushies on the Products tab to track stock."}</div>`}
        </div>
      </section>`;

    const recent = groupOrders(state.sales).slice(0, 5);
    const recentHTML = `
      <section class="panel">
        <div class="month-head"><h2>Recent sales</h2>${state.sales.length ? `<button class="linkbtn" data-go="sales">See all</button>` : ""}</div>
        <div class="rows">${recent.length ? recent.map(saleRow).join("") : `<div class="empty">Tap “Record sale” after you sell a plushie.</div>`}</div>
      </section>`;

    // At a show: running totals for it, right at the top
    const nowPanels = eventsInPickOrder().now.map((ev) => {
      const t = eventTotals(ev);
      return `<section class="panel">
        <div class="month-head"><h2>Today at ${esc(ev.name)}</h2><button class="linkbtn" data-event-sales="${esc(ev.id)}">See sales</button></div>
        <div class="stats num">
          <div class="stat"><div class="label">Sales</div><div class="v">${fmtShort(t.revenue)}</div><span class="d">${t.orders} sale${t.orders === 1 ? "" : "s"}</span></div>
          <div class="stat"><div class="label">Plushies sold</div><div class="v">${t.units}</div></div>
          <div class="stat"><div class="label">After costs</div><div class="v">${fmtShort(t.profit)}</div><span class="d">yarn${ev.fee ? " & booth fee" : ""}</span></div>
        </div>
        ${t.orders ? `<div class="num" style="margin-top:10px;padding-top:10px;border-top:2px dashed var(--line);font-size:.88rem"><span class="label">By payment</span> ${payBreakdown(state.sales.filter((s) => s.eventId === ev.id))}</div>` : ""}
      </section>`;
    }).join("");

    // The next show, with stock on hand to plan how many more to make
    let nextHTML = "";
    const next = eventsInPickOrder().upcoming[0];
    if (!nowPanels) {
      const inStock = state.products.reduce((n, p) => n + (p.stock || 0), 0);
      if (next) {
        const [ny, mo, d] = next.start.split("-").map(Number), [ty, tm, td] = todayStr().split("-").map(Number);
        const days = Math.round((new Date(ny, mo - 1, d) - new Date(ty, tm - 1, td)) / 864e5);
        nextHTML = `<section class="panel next-show">
          <div class="main"><div class="label">Next show</div>
            <div class="title">${esc(next.name)}</div>
            <div class="sub num">${esc(evDates(next))} · ${days === 1 ? "tomorrow" : `in ${days} days`} · ${inStock} plushie${inStock === 1 ? "" : "s"} in stock</div></div>
          <button class="linkbtn" data-go="events">Events</button>
        </section>`;
      } else {
        nextHTML = `<section class="panel next-show">
          <div class="main"><div class="label">Next show</div><div class="sub">None scheduled yet · ${inStock} plushie${inStock === 1 ? "" : "s"} in stock</div></div>
          <button class="linkbtn" data-act="new-event">Add event</button>
        </section>`;
      }
    }

    return nowPanels + nextHTML + stats + `<div class="grid-2">${chart}${recentHTML}</div><div class="grid-2">${best}${lowHTML}</div>`;
  }

  // One row per sale; a sale with several plushies lists them together
  function saleRow(lines) {
    const s = lines[0], p = productById(s.productId);
    const color = (p && p.color) || s.color || YARN[6];
    const label = (x) => { const q = productById(x.productId); return esc(q ? q.name : x.productName) + (x.qty > 1 ? ` <span class="num">×${x.qty}</span>` : ""); };
    const names = lines.slice(0, 3).map(label).join(", ") + (lines.length > 3 ? `, +${lines.length - 3} more` : "");
    const total = lines.reduce((n, x) => n + (x.total || 0), 0);
    return `<div class="row salerow" data-sale="${esc(s.id)}" tabindex="0" role="button">
      ${avatar(p && p.photo, color)}
      <div class="main"><div class="title">${names} ${s.example ? '<span class="chip ex">Example</span>' : ""}</div>
      <div class="sub">${esc(dayLabel(s.date))} · ${esc(saleEventName(s) || s.channel || "Sale")}${s.payment ? " · " + esc(s.payment) : ""}${s.note ? " · " + esc(s.note) : ""}</div></div>
      <div class="amt num">${fmt(total)}</div></div>`;
  }

  function productsHTML() {
    const sold = soldByProduct();
    const q = state.search.trim().toLowerCase();
    const list = state.products
      .filter((p) => !q || (p.name || "").toLowerCase().includes(q) || (p.notes || "").toLowerCase().includes(q) || (p.barcode || "").toLowerCase().includes(q))
      .sort((a, b) => (a.name || "").localeCompare(b.name || ""));
    const stockTotal = state.products.reduce((n, p) => n + (p.stock || 0), 0);
    const stockValue = state.products.reduce((n, p) => n + (p.stock || 0) * (p.price || 0), 0);
    return `
      <section class="panel">
        <div class="toolbar">
          <input class="search" id="q" type="search" placeholder="Search plushies" value="${esc(state.search)}" aria-label="Search plushies">
          ${state.readOnly ? "" : `<div style="display:flex;gap:8px"><button class="btn ghost" data-act="print-tags" type="button">Print tags${queueTotal() ? ` <span class="num">· ${queueTotal()}</span>` : ""}</button><button class="btn" data-act="new-product" id="new-product">Add plushie</button></div>`}
        </div>
        <div class="sub num" style="margin-top:10px;color:var(--muted);font-size:.85rem">${state.products.length} design${state.products.length === 1 ? "" : "s"} · ${stockTotal} in stock · ${fmtShort(stockValue)} at full price</div>
      </section>
      ${list.length ? `<div class="cards">${list.map((p) => {
        const s = sold.get(p.id) || { units: 0 };
        const stock = p.stock || 0;
        return `<article class="pcard">
          <div class="top">
            ${avatar(p.photo, p.color, true)}
            <div class="main">
              <div class="name">${esc(p.name)}</div>
              <div class="meta num">${fmt(p.price)}${p.cost ? ` · ${fmt(p.cost)} materials` : ""}${p.hours ? ` · ${p.hours} hr to make` : ""}</div>
              ${p.notes ? `<div class="meta">${esc(p.notes)}</div>` : ""}
              ${p.barcode ? `<div class="meta num">Barcode ${esc(p.barcode)}</div>` : ""}
              ${state.readOnly ? "" : `<div class="tag-row"><button class="linkbtn" type="button" data-tag-add="${esc(p.id)}">+ Add tag</button>${queued(p.id) ? `<span class="chip num">${queued(p.id)} tag${queued(p.id) === 1 ? "" : "s"} to print</span>` : ""}</div>`}
              ${cleanUrl(p.pattern) ? `<a class="pattern" href="${esc(cleanUrl(p.pattern))}" target="_blank" rel="noopener noreferrer" title="${esc(p.pattern)}">Pattern<span aria-hidden="true"> ↗</span><span class="host">${esc(new URL(cleanUrl(p.pattern)).hostname.replace(/^www\./, ""))}</span></a>` : ""}
            </div>
            ${state.readOnly ? "" : `<button class="linkbtn" data-edit="${esc(p.id)}" aria-label="Edit ${esc(p.name)}">Edit</button>`}
          </div>
          <div class="bottom">
            <div>
              ${p.example ? '<span class="chip ex">Example</span> ' : ""}${stock <= 1 ? `<span class="chip low">${stock ? "Last one" : "Sold out"}</span> ` : ""}<span class="label num">${s.units} sold</span>
            </div>
            <div class="stepper" aria-label="Stock for ${esc(p.name)}">
              ${state.readOnly ? "" : `<button data-stock="${esc(p.id)}" data-d="-1" aria-label="One fewer in stock">−</button>`}
              <span class="n num">${stock}</span>
              ${state.readOnly ? "" : `<button data-stock="${esc(p.id)}" data-d="1" aria-label="One more in stock">+</button>`}
            </div>
          </div>
        </article>`;
      }).join("")}</div>` : `<section class="panel"><div class="empty">${state.products.length ? "No plushies match that search." : "No plushies yet. Add each design you make with its price and how many you have on hand."}</div></section>`}
    `;
  }

  function eventsHTML() {
    const by = eventsInPickOrder();
    const card = (ev) => {
      const t = eventTotals(ev), st = evStatus(ev);
      return `<article class="pcard">
        <div class="top">
          <div class="main">
            <div class="name">${esc(ev.name)}</div>
            <div class="meta">${esc(evDates(ev))}${ev.location ? ` · ${esc(ev.location)}` : ""}</div>
            ${ev.fee ? `<div class="meta num">Booth fee ${fmt(ev.fee)}</div>` : ""}
            ${ev.notes ? `<div class="meta">${esc(ev.notes)}</div>` : ""}
          </div>
          <button class="linkbtn" data-edit-event="${esc(ev.id)}" aria-label="Edit ${esc(ev.name)}">Edit</button>
        </div>
        <div class="bottom">
          <div class="num">${ev.example ? '<span class="chip ex">Example</span> ' : ""}${st === "now" ? '<span class="chip">Today</span> ' : ""}
            ${t.orders ? `<b>${fmt(t.revenue)}</b> <span class="label">${t.units} sold</span><div class="sub" style="font-size:.78rem;color:var(--muted)">${fmt(t.profit)} after yarn${ev.fee ? " & booth fee" : ""}</div><div class="sub num" style="font-size:.78rem;color:var(--muted)">${payBreakdown(state.sales.filter((s) => s.eventId === ev.id))}</div>`
              : `<span class="label">${st === "upcoming" ? "Coming up" : "No sales"}</span>`}
          </div>
          ${t.orders ? `<button class="linkbtn" data-event-sales="${esc(ev.id)}">See sales</button>` : ""}
        </div>
      </article>`;
    };
    const group = (title, list) => (list.length ? `<h2 class="sect">${title}</h2><div class="cards">${list.map(card).join("")}</div>` : "");
    // Past shows by year, with the year's totals, so a few seasons stay easy to compare
    const pastByYear = () => {
      const years = new Map();
      for (const ev of by.past) { const y = ev.start.slice(0, 4); if (!years.has(y)) years.set(y, []); years.get(y).push(ev); }
      return [...years.entries()].map(([y, list]) => {
        const rev = list.reduce((n, ev) => n + eventTotals(ev).revenue, 0);
        return `<h2 class="sect">Past events ${y}<span class="yr num">${list.length} show${list.length === 1 ? "" : "s"} · ${fmt(rev)}</span></h2><div class="cards">${list.map(card).join("")}</div>`;
      }).join("");
    };
    return `
      <section class="panel">
        <div class="toolbar">
          <div class="sub" style="color:var(--muted);font-size:.9rem;flex:1 1 200px">Craft shows and markets. Sales recorded at a show add up here.</div>
          <button class="btn" data-act="new-event" type="button">Add event</button>
        </div>
      </section>
      ${state.events.length ? group("Happening now", by.now) + group("Coming up", by.upcoming) + pastByYear()
        : `<section class="panel"><div class="empty">No events yet. Add a craft show before you go, or create one when you record your first sale there.</div></section>`}`;
  }

  function salesHTML() {
    const fp = state.filterProduct, fe = state.filterEvent;
    const list = state.sales.filter((s) => (!fp || s.productId === fp) && (!fe || s.eventId === fe));
    const groups = new Map();
    for (const s of list) { const k = monthKey(s.date); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(s); }
    const opts = state.products.slice().sort((a, b) => (a.name || "").localeCompare(b.name || ""))
      .map((p) => `<option value="${esc(p.id)}" ${p.id === fp ? "selected" : ""}>${esc(p.name)}</option>`).join("");
    const evOpts = state.events.slice().sort((a, b) => b.start.localeCompare(a.start))
      .map((ev) => `<option value="${esc(ev.id)}" ${ev.id === fe ? "selected" : ""}>${esc(ev.name)}</option>`).join("");
    const allRev = list.reduce((n, s) => n + (s.total || 0), 0), allUnits = list.reduce((n, s) => n + (s.qty || 0), 0);
    return `
      <section class="panel">
        <div class="toolbar">
          <select id="filter-product" aria-label="Show sales for plushie" style="flex:1 1 160px">
            <option value="">All plushies</option>${opts}
          </select>
          ${state.events.length ? `<select id="filter-event" aria-label="Show sales at event" style="flex:1 1 160px">
            <option value="">All events</option>${evOpts}
          </select>` : ""}
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn ghost small" data-act="import" type="button">Import CSV</button>
            ${state.sales.length ? `<button class="btn ghost small" data-act="csv" type="button">Download CSV</button>` : ""}
          </div>
        </div>
        <div class="num" style="margin-top:10px;color:var(--muted);font-size:.85rem">${groupOrders(list).length} sale${groupOrders(list).length === 1 ? "" : "s"} · ${allUnits} plushie${allUnits === 1 ? "" : "s"} · ${fmt(allRev)}${fe ? "" : " all time"}</div>
        ${list.length ? `<div class="num" style="margin-top:4px;color:var(--muted);font-size:.85rem">${payBreakdown(list)}</div>` : ""}
      </section>
      <section class="panel">
        ${groups.size ? [...groups.entries()].map(([k, arr]) => {
          const tot = arr.reduce((n, s) => n + (s.total || 0), 0), u = arr.reduce((n, s) => n + (s.qty || 0), 0);
          return `<div class="monthgroup"><h4><span>${esc(monthLabel(k))}</span><span class="num">${u} sold · ${fmt(tot)}</span></h4><div class="rows">${groupOrders(arr).map(saleRow).join("")}</div></div>`;
        }).join("") : `<div class="empty">${fp || fe ? "No sales match these filters." : "No sales yet. Tap “Record sale” after each sale and your history builds up here, month by month."}</div>`}
      </section>
      <section class="panel">
        <h2>Payment methods</h2>
        <p class="sub" style="margin:-6px 0 12px;color:var(--muted);font-size:.85rem">Choices for “Paid with” when recording a sale. The first one is picked by default; tap a name to make it first.</p>
        <div class="pay-list">${payMethods().map((m, i) => `<span class="pay-chip">
          <button class="nm" type="button" data-pay-first="${esc(m)}" ${i ? "" : "disabled"}>${esc(m)}${i ? "" : "<small>default</small>"}</button>
          <button class="x" type="button" data-pay-remove="${esc(m)}" aria-label="Remove ${esc(m)}">×</button></span>`).join("")}</div>
        <form class="pay-add" id="pay-add"><input id="pay-new" placeholder="e.g. Venmo, Square, Check" autocomplete="off" aria-label="New payment method"><button class="btn small" type="submit">Add</button></form>
      </section>`;
  }

  // ---------- Sheets ----------
  function openSheet(html, onMount) {
    const root = document.getElementById("sheet-root");
    root.innerHTML = `<div class="overlay" id="overlay"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
    const ov = document.getElementById("overlay");
    ov.addEventListener("click", (e) => { if (e.target === ov) closeSheet(); });
    onMount && onMount(root.querySelector(".sheet"));
    const first = root.querySelector("input:not(.vh), select, textarea"); if (first && window.innerWidth > 640) first.focus();
  }
  function closeSheet() { document.getElementById("sheet-root").innerHTML = ""; }
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

  function armDelete(btn, label, fn) {
    btn.addEventListener("click", async () => {
      if (!btn.classList.contains("armed")) { btn.classList.add("armed"); btn.textContent = "Tap again to delete"; setTimeout(() => { btn.classList.remove("armed"); btn.textContent = label; }, 3500); return; }
      await fn();
    });
  }
