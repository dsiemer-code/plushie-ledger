<svg xmlns="http://www.w3.org/2000/svg" width="2in" height="2in" viewBox="0 0 144 144">
  <!-- Clarissa Leah Makes tag, front (2 x 2 in). Recreated from her printed tags; can be replaced with an Inkscape design.
       Plushie Ledger fills id="name" and id="price", and draws the QR code inside the rect id="qr".
       The light circle marks where to punch the hole. -->
  <circle cx="15" cy="15" r="4.5" fill="none" stroke="#c4c4c4" stroke-width="0.5"/>
  <g fill="#111">
    <text x="72" y="33" text-anchor="middle" font-family="Josefin Sans, sans-serif" font-weight="300" font-size="15" letter-spacing="0.5">CLARISSA LEAH</text>
    <text x="83" y="47" text-anchor="middle" font-family="Sacramento, cursive" font-size="19">makes</text>
    <path d="M36 56 H108" stroke="#111" stroke-width="0.6"/>
    <text id="name" x="72" y="73" text-anchor="middle" font-family="Figtree, Helvetica, Arial, sans-serif" font-weight="600" font-size="11">Plushie name</text>
    <text id="price" x="12" y="128" font-family="Josefin Sans, sans-serif" font-weight="400" font-size="28">$00</text>
  </g>
  <rect id="qr" x="90" y="88" width="44" height="44" fill="none"/>
</svg>
